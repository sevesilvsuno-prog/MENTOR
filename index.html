{id:"l35",niveau:5,duree:8,badge:"🏠",badgeNom:"Propriétaire de papier",titre:"L'immobilier sans les clés : SCPI et foncières cotées",
contenu:"<p><b>Le quoi.</b> Posséder de l'immobilier sans acheter d'appartement : deux véhicules. Les <b>SCPI</b> (« pierre-papier ») : tu achètes des parts d'une société qui détient des dizaines d'immeubles (bureaux, commerces, santé) et te reverse les loyers — non cotées, valorisées quelques fois par an. Les <b>foncières cotées</b> (REIT) : même idée, mais en bourse — liquides, achetables comme une action, et donc plus volatiles.</p><p><b>Le pourquoi.</b> L'immobilier a sa propre respiration : des loyers réguliers, une protection partielle contre l'inflation (les baux sont souvent indexés), et une décorrélation PARTIELLE des actions. Dans une allocation, il joue le rôle de deuxième pilier de rendement — mais attention à l'exposition cachée : si tu possèdes déjà ta résidence principale, ton patrimoine est peut-être DÉJÀ à 70 % immobilier.</p><p><b>Le comment.</b> SCPI : viser des frais d'entrée raisonnables (ils ont longtemps été de 8-10 % ! des SCPI sans frais d'entrée existent désormais), un taux d'occupation > 90 %, une diversification sectorielle, et comprendre que la liquidité n'est PAS garantie (revendre peut prendre des mois — la crise des SCPI de bureaux de 2023-2024 l'a rappelé durement). Foncières cotées : liquides mais elles se comportent en bourse comme des actions sensibles aux taux — quand les taux montent, elles chutent. Fiscalité : les loyers de SCPI en direct sont imposés comme des revenus fonciers (souvent lourd) ; via l'assurance-vie, c'est généralement plus doux.</p><p><b>Le risque.</b> Le mirage du rendement affiché : « 6 % ! » — avant frais d'entrée, avant fiscalité, avant baisse éventuelle du prix de la part. Les détenteurs de SCPI de bureaux l'ont appris en 2023 : le rendement continuait de tomber pendant que la valeur des parts baissait de 10 à 17 %. Rendement n'est pas rendement TOTAL.</p>",
exemple:"Tu investis 10 000 € dans une SCPI à 8 % de frais d'entrée servant 5,5 % : tu pars avec 9 200 € de valeur réelle, et il te faut presque 2 ans de loyers juste pour rembourser les frais. La même somme dans une SCPI sans frais d'entrée à 5 % te laisse gagnant dès la première année. Le rendement affiché faisait pourtant préférer la première…",
quiz:[
{q:"Quelle différence majeure entre SCPI et foncière cotée ?",o:["La SCPI n'est pas cotée (liquidité lente), la foncière s'échange en bourse (liquide mais volatile)","Aucune","La foncière ne verse jamais de loyers"],b:0,e:"Même métier (percevoir des loyers), deux enveloppes : l'une lente et lissée, l'autre instantanée et chahutée."},
{q:"Pourquoi vérifier son exposition immobilière TOTALE avant d'acheter des SCPI ?",o:["Pour le plaisir","Parce que la résidence principale fait déjà de beaucoup de Français des patrimoines à dominante immobilière","C'est une obligation légale"],b:1,e:"Diversifier, c'est raisonner sur TOUT le patrimoine : ajouter de la pierre-papier à un patrimoine déjà tout en pierre concentre au lieu de diversifier."},
{q:"Un rendement SCPI affiché à 6 % signifie…",o:["Que tu gagneras 6 % net, garanti","Un chiffre avant frais, fiscalité et variation du prix de la part","Que la part montera de 6 %"],b:1,e:"2023-2024 l'a rappelé : des SCPI servaient leur rendement pendant que la valeur des parts chutait de plus de 10 %."}]},

{id:"l36",niveau:5,duree:8,badge:"🧾",badgeNom:"Obligataire pratique",titre:"Les obligations en pratique : fonds euros, ETF et fonds datés",
contenu:"<p><b>Le quoi.</b> La leçon 3 a expliqué la théorie ; voici comment on détient VRAIMENT des obligations en France. Quatre véhicules : le <b>fonds euros</b> d'assurance-vie (un portefeuille obligataire géré, avec capital garanti par l'assureur — la solution par défaut) ; les <b>ETF obligataires</b> (paniers cotés d'obligations d'États ou d'entreprises) ; les <b>fonds datés</b> (on achète un panier d'obligations toutes remboursées vers une même année, ex. 2029 — visibilité du rendement si on tient jusqu'au bout) ; et le bon vieux <b>compte à terme</b> pour les horizons courts.</p><p><b>Le pourquoi.</b> Depuis la remontée des taux de 2022-2023, l'obligataire redevient un vrai outil : les fonds euros servent à nouveau 2,5 à 3,5 %+, les obligations d'entreprises solides offrent 3 à 5 %. C'est l'amortisseur du patrimoine — la poche qui permet de dormir ET de renforcer les actions quand elles soldent.</p><p><b>Le comment (par horizon).</b> Argent utile dans moins de 3 ans : livrets, comptes à terme, fonds euros — point final. Poche de stabilité de long terme : fonds euros (simplicité, garantie) en premier choix ; ETF obligataires pour les comptes-titres, en sachant qu'ils BOUGENT (un ETF d'obligations longues a perdu ~15 à 30 % en 2022 quand les taux ont bondi — « sans risque » ne s'applique qu'à l'échéance, pas au parcours). Fonds datés : intéressants quand les taux sont hauts, à condition de tenir jusqu'à l'échéance et de surveiller les frais.</p><p><b>Le risque.</b> Confondre « obligataire » et « immobile ». La valeur d'une obligation en cours de route fluctue à l'inverse des taux (leçon 3) — 2022 fut la pire année obligataire moderne. La garantie du fonds euros, elle, est réelle mais repose sur la solidité de l'assureur, et sa performance peut être rognée par les frais du contrat : regarde toujours le rendement NET des frais de gestion.</p>",
exemple:"100 000 € à sécuriser pour dans 4 ans. Option A, fonds euros à 3 % net : ≈ 112 500 € dans 4 ans, trajet sans secousse. Option B, ETF obligations longues : rendement espéré similaire, MAIS si les taux remontent de 2 points l'an prochain, le parcours passe par −15 % — supportable seulement si tu n'as pas besoin de vendre. Même famille d'actifs, deux expériences opposées.",
quiz:[
{q:"Quel est le véhicule obligataire « par défaut » du particulier français ?",o:["Les options sur obligations","Le fonds euros de l'assurance-vie","Le CFD obligataire"],b:1,e:"Capital garanti par l'assureur, gestion professionnelle, disponibilité : c'est la poche de stabilité de référence — à condition de surveiller les frais du contrat."},
{q:"Pourquoi un ETF obligataire peut-il perdre 15 % alors que les obligations « remboursent à 100 » ?",o:["C'est impossible","Parce qu'en cours de route, les prix obligataires baissent quand les taux montent","À cause des dividendes"],b:1,e:"2022 l'a montré brutalement. La stabilité obligataire n'existe qu'à l'échéance — un fonds perpétuel n'a pas d'échéance."},
{q:"Un fonds daté « échéance 2029 » est surtout pertinent si…",o:["Tu comptes le revendre dans 6 mois","Tu peux le conserver jusqu'à l'échéance","Les taux sont à zéro"],b:1,e:"Sa promesse de rendement ne vaut qu'au bout du chemin ; en sortir avant t'expose aux fluctuations de taux comme n'importe quel fonds."}]},

{id:"l37",niveau:5,duree:7,badge:"🥇",badgeNom:"Gardien du coffre",titre:"L'or et les matières premières : assurance, pas placement",
contenu:"<p><b>Le quoi.</b> L'or ne produit RIEN : ni loyer, ni dividende, ni intérêt. Sa valeur repose sur 5 000 ans de confiance collective et sa rareté. C'est précisément ce qui en fait un actif à part : il ne dépend d'aucune promesse d'entreprise ou d'État. Les autres matières premières (pétrole, cuivre, blé…) sont encore autre chose : des paris industriels très volatils, à laisser aux professionnels.</p><p><b>Le pourquoi.</b> L'or joue le rôle d'<b>assurance de portefeuille</b> : il monte souvent quand tout va mal (crises, guerres, peur de l'inflation ou des monnaies) — 2008, 2020 et 2022-2025 l'ont illustré. Mais sur très longue période, il rapporte nettement moins que les actions : c'est le prix de l'assurance. On ne s'enrichit pas avec son extincteur ; on est content de l'avoir le jour de l'incendie.</p><p><b>Le comment.</b> Dose : 0 à 10 % du patrimoine — au-delà, l'assurance dévore le rendement. Véhicules : l'<b>ETC or physique</b> (fonds coté adossé à des lingots en coffre, frais ~0,15-0,4 %/an) est la voie simple ; les pièces/lingots physiques ont un charme réel mais des frais d'achat-revente de plusieurs % et un problème de stockage ; les actions de mines d'or ne sont PAS de l'or (ce sont des entreprises, avec un levier violent sur le métal). Fiscalité française du physique : taxe forfaitaire de 11,5 % à la revente, ou régime des plus-values avec abattement par année de détention (exonération au bout de 22 ans) — l'ETC en compte-titres suit lui la flat tax classique.</p><p><b>Le risque.</b> Le chant des sirènes apocalyptiques : des vendeurs entiers vivent de la peur (« tout va s'effondrer, achetez de l'or ! »). L'or peut aussi stagner des DÉCENNIES (1980-2000 : −70 % en termes réels). Assurance, dose modérée, zéro fascination.</p>",
exemple:"Portefeuille A, 100 % actions monde : −34 % au pire de mars 2020. Portefeuille B, 90 % actions + 10 % or : −29 % au même moment, l'or ayant bondi — et surtout son détenteur a mieux dormi et n'a pas vendu. Sur les 30 années précédentes en revanche, A a fini plus haut que B : l'assurance a un coût. Les deux choix se défendent ; l'important est de le faire en connaissance de cause.",
quiz:[
{q:"Pourquoi dit-on que l'or est une assurance plutôt qu'un placement ?",o:["Il ne produit rien mais protège dans les tempêtes","Il monte tous les ans","Il est garanti par l'État"],b:0,e:"Pas de cash-flow = pas de moteur de rendement propre. Sa valeur est une protection collective contre les crises de confiance."},
{q:"Quelle dose d'or est raisonnable dans un patrimoine ?",o:["0 à 10 %","50 %","100 % en cas de crise annoncée"],b:0,e:"Assez pour amortir les chocs, pas au point d'étouffer le rendement de long terme. Et personne ne sait « annoncer » les crises."},
{q:"Une action de mine d'or, c'est…",o:["Équivalent à détenir de l'or","Une entreprise, avec ses coûts et ses risques, amplifiant les mouvements du métal","Sans aucun rapport avec l'or"],b:1,e:"Les minières font ×2 quand l'or monte de 30 %… et −60 % quand il recule de 20 %. C'est un levier industriel, pas un coffre."}]},

{id:"l38",niveau:5,duree:9,badge:"📜",badgeNom:"Stratège de l'enveloppe",titre:"L'assurance-vie en grand : le couteau suisse du patrimoine français",
contenu:"<p><b>Le quoi.</b> Troisième pilier des enveloppes françaises (avec PEA et CTO, leçon 9), l'assurance-vie mérite sa leçon complète : c'est un CONTRAT (pas un compte) combinant un <b>fonds euros</b> garanti et des <b>unités de compte</b> (ETF, fonds, SCPI, actions…), avec une fiscalité qui s'adoucit avec l'âge du contrat et un statut successoral unique.</p><p><b>Le pourquoi — les 3 super-pouvoirs.</b> 1) <b>Fiscalité après 8 ans</b> : un abattement annuel de 4 600 € de gains retirés (9 200 € pour un couple) — bien utilisé, tu peux retirer chaque année sans payer d'impôt sur le revenu (restent les 17,2 % de prélèvements sociaux). 2) <b>La transmission</b> : jusqu'à 152 500 € transmis PAR bénéficiaire hors succession (pour les versements avant 70 ans) — aucun autre outil ne fait ça. 3) <b>La souplesse</b> : arbitrages internes entre fonds euros et unités de compte sans déclencher d'impôt, retraits partiels libres, avances possibles.</p><p><b>Le comment.</b> La règle qui change tout : <b>ouvrir tôt pour prendre date</b> — l'horloge des 8 ans court dès l'ouverture, même avec 100 €. Choisir un contrat EN LIGNE à frais réduits : 0 % sur versements, ≤ 0,6 %/an de frais de gestion, ETF disponibles — les contrats bancaires classiques prélèvent souvent 3 % à l'entrée + 1 %/an + des unités de compte chargées : de quoi manger un tiers du résultat final (leçon 8 !). Architecture type : fonds euros pour la poche stable + ETF monde en unités de compte pour la poche dynamique.</p><p><b>Le risque.</b> Les unités de compte ne sont PAS garanties (le capital fluctue comme leurs sous-jacents), et le démarchage bancaire pousse souvent vers les fonds « maison » chargés en frais plutôt que vers les ETF. L'assurance-vie est un excellent OUTIL ; comme tout outil, son résultat dépend de ce qu'on met dedans.</p>",
exemple:"Louise, 30 ans, ouvre une assurance-vie en ligne avec 500 € « pour prendre date ». À 45 ans, son contrat vaut 80 000 € dont 30 000 € de gains. Elle retire 9 000 €/an pour compléter ses revenus : la part de gains dans chaque retrait reste sous l'abattement de 4 600 € → 0 € d'impôt sur le revenu, seulement les prélèvements sociaux sur la part de gains. Son frère, qui a tout en CTO, paie 12,8 % d'impôt sur les mêmes gains retirés. Prendre date à 30 ans a créé cet écart.",
quiz:[
{q:"Que signifie « prendre date » en assurance-vie ?",o:["Fixer un rendez-vous avec son banquier","Ouvrir le contrat tôt, même avec peu, pour faire courir l'horloge fiscale des 8 ans","Choisir la date des retraits"],b:1,e:"L'abattement annuel après 8 ans se calcule depuis l'OUVERTURE : 100 € investis aujourd'hui ouvrent des droits pour toute la vie du contrat."},
{q:"Quel est l'avantage successoral de l'assurance-vie ?",o:["Aucun","Jusqu'à 152 500 € par bénéficiaire transmis hors succession (versements avant 70 ans)","Elle supprime tous les impôts"],b:1,e:"C'est l'outil de transmission le plus puissant du droit français — unique en son genre."},
{q:"Entre un contrat bancaire classique (3 % d'entrée, 1 %/an) et un contrat en ligne (0 %, 0,5 %/an), l'écart à 25 ans…",o:["Est négligeable","Peut représenter un tiers du capital final","Favorise le contrat bancaire"],b:1,e:"Les frais composent contre toi (leçon 8). À rendement identique, le contrat chargé ampute massivement le résultat."}]},

{id:"l39",niveau:5,duree:8,badge:"🎯",badgeNom:"Architecte retraite",titre:"Le PER : préparer sa retraite avec un bonus fiscal immédiat",
contenu:"<p><b>Le quoi.</b> Le Plan d'Épargne Retraite (PER) est l'enveloppe dédiée retraite : tu verses, tu <b>déduis les versements de ton revenu imposable</b> (dans certaines limites), l'argent fructifie (fonds euros + unités de compte, comme une assurance-vie), et il est <b>bloqué jusqu'à la retraite</b> — sauf accidents de la vie et achat de la résidence principale.</p><p><b>Le pourquoi.</b> Le bonus fiscal est immédiat et proportionnel à ta tranche d'imposition : dans la tranche à 30 %, verser 1 000 € ne te « coûte » que 700 € (300 € d'impôt en moins l'année même). C'est un rendement fiscal instantané que rien d'autre n'offre. MAIS — et c'est le cœur de la leçon — l'avantage n'est qu'un <b>report</b> : à la sortie, le capital issu des versements déduits est imposé au barème. Le pari gagnant : être moins imposé à la retraite qu'aujourd'hui (cas de la majorité des gens).</p><p><b>Le comment — à qui le PER convient-il ?</b> Très pertinent si : tranche à 30 % ou plus, horizon retraite assumé, et épargne de précaution + PEA/assurance-vie déjà en place. Peu pertinent si : tranche à 11 % ou non imposable (le bonus est faible et tu bloques ton argent), ou si tu pourrais avoir besoin des fonds avant. La hiérarchie MENTOR des enveloppes : 1) épargne de précaution, 2) PEA (souplesse + fiscalité), 3) assurance-vie (souplesse + transmission), 4) PER (uniquement pour l'excédent long terme des contribuables bien imposés). Même exigence que partout : un PER en ligne à frais réduits, garni d'ETF.</p><p><b>Le risque.</b> Le blocage, psychologiquement sous-estimé : la vie change (projet, coup dur non prévu par les cas de déblocage) et l'argent est derrière une vitre. Et le démarchage : le PER est très vendu en agence PARCE qU'il est rentable… pour le vendeur. Frais d'abord, fiscalité ensuite.</p>",
exemple:"Nadia, tranche à 30 %, verse 3 000 €/an sur un PER en ligne : 900 €/an d'impôt en moins, pendant 20 ans. À la retraite, sa tranche tombe à 11 % : elle récupère son capital en rentes et retraits imposés bien plus doucement qu'ils n'ont été déduits. Gain fiscal net sur la vie du contrat : plusieurs milliers d'euros. Son collègue non imposable qui a signé le même PER « parce que le conseiller insistait » n'a RIEN déduit — et son argent est bloqué 25 ans.",
quiz:[
{q:"Quel est l'avantage immédiat du PER ?",o:["Les gains ne sont jamais imposés","Les versements se déduisent du revenu imposable","Le capital est disponible à tout moment"],b:1,e:"Dans la tranche à 30 %, 1 000 € versés = 300 € d'impôt en moins tout de suite. C'est un report d'imposition, pas un cadeau définitif."},
{q:"Pour qui le PER est-il le PLUS pertinent ?",o:["Les non-imposables","Les contribuables en tranche 30 %+ avec un horizon retraite assumé","Tout le monde, toujours"],b:1,e:"Le bonus est proportionnel à la tranche, et le pari repose sur une imposition plus douce à la retraite."},
{q:"Quelle est la bonne place du PER dans la hiérarchie des enveloppes ?",o:["En premier, avant tout","Après l'épargne de précaution, le PEA et l'assurance-vie","À la place du livret A"],b:1,e:"Son défaut majeur est le blocage : on n'y met que l'excédent vraiment long terme, une fois les enveloppes souples remplies."}]},

{id:"l40",niveau:5,duree:8,badge:"🧮",badgeNom:"Optimiseur fiscal",titre:"La fiscalité fine : faire travailler les enveloppes ensemble",
contenu:"<p><b>Le quoi.</b> Tu connais chaque enveloppe (PEA, CTO, assurance-vie, PER) ; l'étage supérieur consiste à les faire jouer <b>ensemble</b> : où loger quoi, dans quel ordre verser, dans quel ordre retirer, et comment utiliser les règles à ton avantage — en toute légalité, ce sont des dispositifs voulus par le législateur.</p><p><b>Le pourquoi.</b> À placements identiques, deux épargnants peuvent avoir des résultats nets d'impôts différant de 15 à 25 % sur une vie, juste par l'ordre et le choix des enveloppes. C'est le dernier « rendement gratuit » après les frais (leçon 8).</p><p><b>Le comment — les 5 règles d'or.</b> 1) <b>Ordre de remplissage</b> : précaution → PEA (jusqu'au plafond, pour les actions) → assurance-vie (souplesse, transmission) → PER (si tranche 30 %+) → CTO (le reste, actions monde hors PEA). 2) <b>Localisation des actifs</b> : les actifs qui distribuent beaucoup (foncières, fonds à dividendes) plutôt en assurance-vie ou PEA ; les ETF capitalisants supportent très bien le CTO (pas d'imposition tant qu'on ne vend pas). 3) <b>Compensation des moins-values</b> (CTO) : les pertes réalisées s'imputent sur les gains réalisés de l'année et des 10 suivantes — vendre une position en perte peut « effacer » l'impôt d'une vente en gain. 4) <b>Ordre des retraits</b> à long terme : d'abord les abattements gratuits (assurance-vie 8 ans+ : 4 600 €/an), puis PEA (17,2 % seulement), le CTO en dernier. 5) <b>Chaque année</b> : vérifier le pré-rempli (leçon 24), déclarer le 3916-bis (eToro), et noter que l'option « barème » peut battre la flat tax pour les faibles revenus.</p><p><b>Le risque.</b> La sur-optimisation : monter des usines à gaz fiscales qui dictent les choix d'investissement (« je garde cette mauvaise position pour l'impôt »). La fiscalité OPTIMISE une bonne stratégie ; elle ne doit jamais la COMMANDER. Et pour les situations vraiment complexes (expatriation, succession importante, société) : un professionnel, toujours.</p>",
exemple:"Année de ménage chez Karim (CTO) : il vend une position gagnante (+3 000 € de plus-value) et solde le même mois une vieille ligne perdante (−2 800 €). Plus-value nette imposable : 200 € → impôt : 60 € au lieu de 900 €. La ligne perdante « inutile » a servi une dernière fois. C'est légal, prévu par la loi, et ça s'appelle simplement… compenser.",
quiz:[
{q:"Quel est l'ordre de remplissage recommandé des enveloppes ?",o:["PER d'abord, toujours","Précaution → PEA → assurance-vie → PER (si bien imposé) → CTO","CTO d'abord pour la liberté"],b:1,e:"Des plus protectrices/souples vers les plus contraignantes : chaque euro se loge là où il travaille net le mieux."},
{q:"À quoi servent les moins-values réalisées sur un CTO ?",o:["À rien","À s'imputer sur les plus-values de l'année et des 10 suivantes","À réduire la taxe foncière"],b:1,e:"La compensation des pertes est l'outil fiscal le plus sous-utilisé des particuliers."},
{q:"Quelle est la limite de l'optimisation fiscale ?",o:["Elle ne doit jamais commander la stratégie d'investissement","Il n'y en a pas","Elle est réservée aux riches"],b:0,e:"Garder un mauvais placement « pour l'impôt » revient à perdre 100 pour économiser 30. L'impôt optimise, la stratégie décide."}]},

{id:"l41",niveau:5,duree:9,badge:"🏛️",badgeNom:"Grand architecte",titre:"L'allocation totale : assembler TOUT ton patrimoine",
contenu:"<p><b>Le quoi.</b> La leçon d'architecture générale : ne plus penser « mon PEA » ou « mes SCPI » séparément, mais UN patrimoine total — résidence principale comprise — réparti entre quatre grandes briques : <b>sécurité</b> (livrets, fonds euros), <b>rendement régulier</b> (obligations, immobilier), <b>croissance</b> (actions monde), <b>assurance</b> (or, 0-10 %).</p><p><b>Le pourquoi.</b> C'est l'allocation totale — pas la sélection de titres — qui détermine l'essentiel de ta performance ET de tes émotions. Beaucoup de gens croient être prudents (« je n'ai que 5 000 € en actions ! ») alors que 90 % de leur patrimoine dort en immobilier concentré sur UNE ville ; d'autres se croient audacieux avec 80 % de leur épargne en fonds euros. On ne pilote bien que ce qu'on voit en entier.</p><p><b>Le comment — la méthode en 4 étapes.</b> 1) <b>L'inventaire total</b> (l'exercice qui change la vision) : tout lister — résidence (valeur − crédit restant), livrets, contrats, comptes, même la voiture de collection. 2) <b>La photo en 4 briques</b> : calcule tes pourcentages réels. Surprise garantie. 3) <b>La cible selon ton âge et ton horizon</b> — repère classique à adapter : la part d'actions ≈ « 110 − ton âge » en % de ton patrimoine FINANCIER (hors résidence), modulée par ta tolérance mesurée. 4) <b>Le chemin</b> : on ne bascule jamais brutalement ; on dirige les flux d'épargne nouveaux vers les briques maigres (rebalancement par les flux, leçon 23), sur 12 à 36 mois.</p><p><b>Le risque.</b> Les deux extrêmes : l'inventaire jamais fait (on pilote à l'aveugle) et le tableau Excel obsessionnel recalculé chaque dimanche (le patrimoine n'est pas un tamagotchi). Un inventaire complet par an — par exemple à ton anniversaire — suffit amplement.</p>",
exemple:"Inventaire de Sophie, 35 ans, « très prudente » selon elle : appartement 280 000 € (crédit restant : 160 000 €) → 120 000 € nets ; livret A 15 000 € ; assurance-vie fonds euros 30 000 € ; PEA 12 000 €. Patrimoine : 177 000 €, dont… 68 % immobilier mono-ville, 25 % sécurité, 7 % actions. Sa « prudence » est en réalité une énorme concentration immobilière. Son plan : diriger 100 % de son épargne nouvelle vers le PEA pendant 3 ans — sans rien vendre.",
quiz:[
{q:"Qu'est-ce que l'allocation d'actifs TOTALE ?",o:["La répartition de son PEA","La répartition de tout le patrimoine, résidence principale comprise, en grandes briques","La liste de ses actions"],b:1,e:"On ne juge la prudence ou l'audace d'un patrimoine qu'en le regardant en entier — la résidence principale pèse souvent plus que tout le reste."},
{q:"Que révèle le plus souvent le premier inventaire complet ?",o:["Une répartition parfaitement équilibrée","Une concentration insoupçonnée (souvent immobilière) très éloignée de l'image qu'on s'en faisait","Qu'il manque de l'argent"],b:1,e:"« Je suis prudent » et « 70 % de mon patrimoine dans un seul appartement » cohabitent très souvent — jusqu'à l'inventaire."},
{q:"Comment corriger une allocation déséquilibrée ?",o:["Tout vendre et racheter d'un coup","Diriger l'épargne nouvelle vers les briques maigres, sur 1 à 3 ans","Ne rien faire"],b:1,e:"Le rebalancement par les flux évite impôts, frais et erreurs de timing : la correction douce est presque toujours la bonne."}]},

{id:"l42",niveau:5,duree:9,badge:"🌅",badgeNom:"Rentier en projet",titre:"Vivre de son patrimoine : la règle des 4 % et ses nuances",
contenu:"<p><b>Le quoi.</b> La question ultime de l'épargnant : « combien me faut-il pour que mon patrimoine finance ma vie ? » La réponse la plus célèbre est la <b>règle des 4 %</b> (étude Trinity, États-Unis) : historiquement, retirer chaque année 4 % de son portefeuille initial (ajusté de l'inflation ensuite) a permis à un portefeuille diversifié actions/obligations de survivre au moins 30 ans dans la grande majorité des scénarios passés. Renversée, la règle donne le chiffre magique : <b>capital cible ≈ 25 × tes dépenses annuelles</b>.</p><p><b>Le pourquoi.</b> Même si la retraite est loin, ce calcul transforme l'épargne abstraite en objectif concret : « il me faut 20 000 €/an → 500 000 € de patrimoine financier ». Chaque versement mensuel devient un pas mesurable vers un chiffre qui a du sens — la motivation des mois où la bourse déprime.</p><p><b>Le comment — les nuances qui comptent.</b> 1) La règle vient de données AMÉRICAINES passées ; les études européennes et récentes suggèrent plutôt <b>3 à 3,5 %</b> pour être robuste — soit un capital de 28 à 33 × les dépenses. 2) Le pire ennemi du rentier : le <b>risque de séquence</b> — un krach dans les toutes premières années de retraits fait bien plus de dégâts qu'un krach tardif (on vend beaucoup de parts au pire prix). Parades : une poche de 2-3 ans de dépenses en sécurité, et de la flexibilité (réduire les retraits les années rouges). 3) En France, penser NET : impôts et prélèvements sociaux se prélèvent sur les retraits (d'où l'intérêt de l'ordre de retrait de la leçon 40), et la retraite par répartition couvre déjà une partie des besoins — le patrimoine complète, il ne remplace pas forcément tout.</p><p><b>Le risque.</b> Prendre la règle pour une garantie : c'est une BOUSSOLE statistique tirée du passé, pas un contrat. L'avenir peut faire pire que l'histoire. La vraie sécurité vient du triptyque : taux de retrait prudent + flexibilité + années de coussin. Et rappel MENTOR : pour un projet de retraite précis, un professionnel agréé vaut mieux qu'une règle de pouce.</p>",
exemple:"Rêve de Malik : 1 500 €/mois de complément, soit 18 000 €/an. Règle des 4 % : 18 000 × 25 = 450 000 €. Version prudente à 3,3 % : ≈ 545 000 €. Avec 400 €/mois investis à 6 %/an, il atteint 450 000 € en ≈ 28 ans — 545 000 € en ≈ 31 ans. Trois ans d'écart pour la version robuste : c'est le prix de la sérénité, et Malik trouve qu'il vaut la peine d'être payé.",
quiz:[
{q:"Que dit la règle des 4 % ?",o:["La bourse rapporte 4 % par an, garanti","Historiquement, retirer 4 %/an d'un portefeuille diversifié a tenu 30 ans dans la plupart des scénarios passés","Il faut 4 % d'or en portefeuille"],b:1,e:"C'est une observation statistique du passé (étude Trinity) — une boussole précieuse, pas une promesse."},
{q:"Qu'est-ce que le risque de séquence ?",o:["Le risque d'oublier ses mots de passe","Un krach dans les premières années de retraits, qui force à vendre beaucoup de parts au pire prix","Une erreur de calcul"],b:1,e:"Le MÊME rendement moyen sur 30 ans donne des résultats opposés selon que le krach arrive en année 2 ou en année 25. D'où la poche de sécurité de 2-3 ans."},
{q:"Combien viser pour 20 000 € de retraits annuels, version prudente (3,3 %) ?",o:["100 000 €","Environ 600 000 €","5 millions"],b:1,e:"20 000 ÷ 3,3 % ≈ 606 000 € (soit ~30 fois les dépenses). La version 4 % dirait 500 000 € — l'écart est le coussin de robustesse."}]}
);

{id:"l43",niveau:6,duree:9,badge:"🕳️",badgeNom:"Survivant de 1929",titre:"1929 et la décennie perdue : le krach fondateur, vécu de l'intérieur",
contenu:"<p><b>Le récit.</b> New York, été 1929 : l'Amérique s'enrichit en bourse depuis 8 ans, les chauffeurs de taxi donnent des tuyaux, on emprunte massivement pour acheter des actions (le levier de l'époque : 10 % de couverture !). Le 24 octobre — jeudi noir — la machine s'enraye. En trois ans, le Dow Jones perd <b>89 %</b>. Il ne retrouvera son sommet de 1929 qu'en… <b>1954</b>, 25 ans plus tard.</p><p><b>Les leçons intemporelles.</b> 1) <b>Le levier tue</b> : les ruinés de 1929 ne sont pas ceux qui détenaient des actions, mais ceux qui les détenaient À CRÉDIT — les appels de marge forçaient à vendre au pire moment, en cascade (relis la leçon 18 : rien n'a changé, seuls les habits du levier ont changé). 2) <b>Les « 25 ans pour s'en remettre » sont trompeurs</b> : ce chiffre ignore les dividendes (réinvestis, le retour à l'équilibre a pris ~15 ans), la déflation (les prix baissaient : chaque dollar valait plus), et surtout le DCA — celui qui a continué d'acheter dans les années 30 a fait une affaire historique. 3) <b>L'euphorie AVANT le krach était le signal</b> : « tout le monde » en bourse, à crédit, avec certitude. Retiens la formule : ce n'est pas le krach qui ruine, c'est ce qu'on a fait pendant l'euphorie qui précède.</p><p><b>Et toi ?</b> Ce scénario existe dans le Simulateur d'époques version moderne (2000 et 2008). Avant de le lancer, cette question : si ton portefeuille perdait 80 % et mettait 15 ans à revenir, ton plan actuel (montants, horizon, absence de levier) te permettrait-il de tenir sans vendre ? Si la réponse est non, ce n'est pas ton courage qu'il faut changer — c'est ton plan.</p>",
exemple:"1 000 $ investis au pire sommet de 1929 : ≈ 110 $ trois ans plus tard — mais réinvestis en dividendes, de nouveau ≈ 1 000 $ vers 1944, et ≈ 4 400 $ en 1954. Et 1 000 $ investis PAR AN de 1929 à 1939 (le DCA du courageux) : un des meilleurs points d'entrée du siècle. La différence entre la ruine et la fortune de 1929 tient en deux mots : levier, et régularité.",
quiz:[
{q:"Qui a été ruiné en 1929 ?",o:["Tous les détenteurs d'actions, à jamais","Surtout ceux qui détenaient des actions à crédit, liquidés de force","Personne"],b:1,e:"Les appels de marge sur les comptes à levier ont transformé une baisse en anéantissement. Sans levier, on pouvait attendre — et les dividendes travaillaient."},
{q:"Pourquoi « 25 ans pour retrouver le sommet » exagère-t-il la réalité vécue ?",o:["Le chiffre est faux","Il ignore dividendes réinvestis, déflation et achats réguliers pendant la baisse","La bourse a fermé pendant 25 ans"],b:1,e:"Dividendes réinvestis : ~15 ans. Avec un DCA poursuivi dans les années 30 : une affaire historique. L'indice nu raconte la version la plus noire."},
{q:"Quel était le vrai signal d'alarme en 1929 ?",o:["Le jeudi noir lui-même","L'euphorie généralisée et l'achat massif à crédit qui ont précédé","Un article de journal"],b:1,e:"Les krachs ne s'annoncent pas, mais les euphories se reconnaissent : certitude collective + levier = poudrière. C'est AVANT que tout se joue."}]},

{id:"l44",niveau:6,duree:8,badge:"🔮",badgeNom:"Anti-Nostradamus",titre:"Le biais rétrospectif : pourquoi tout semble « évident » après coup",
contenu:"<p><b>Le quoi.</b> Le biais rétrospectif (hindsight bias) : une fois qu'un événement s'est produit, notre cerveau réécrit le passé pour le rendre « prévisible ». « La bulle internet, c'était ÉVIDENT » ; « les subprimes, tout le monde savait ». Faux : en 1999 et 2007, l'immense majorité — professionnels inclus — ne voyait rien, ou voyait autre chose.</p><p><b>Le pourquoi c'est dangereux.</b> Trois dégâts : 1) Il fabrique une <b>fausse confiance</b> (« puisque c'était évident, je verrai venir la prochaine ») qui pousse aux paris de prédiction. 2) Il rend <b>injuste avec soi-même</b> (« j'aurais dû savoir » sur une décision qui était raisonnable avec l'information d'alors). 3) Il fait admirer les mauvais maîtres : les gourous « qui avaient prédit le krach » ont souvent prédit DIX krachs dont un seul est arrivé — l'horloge arrêtée de la leçon 19.</p><p><b>Le comment (les antidotes).</b> 1) <b>Le journal horodaté</b> — l'arme absolue : tes thèses écrites AVANT te confrontent à ce que tu pensais VRAIMENT, pas à ce que tu crois avoir pensé (c'est pour ça que MENTOR horodate tout). 2) <b>Juger les décisions, pas les résultats</b> : une bonne décision peut mal tourner, une idiotie peut réussir ; on évalue le raisonnement avec l'information disponible à l'époque. 3) <b>Le mode mystère du Simulateur</b> : dates masquées, tu navigues sans savoir « la fin » — l'expérience la plus proche du réel, où ce biais ne peut pas tricher. 4) Devant tout gourou : demander la liste COMPLÈTE de ses prédictions, pas la meilleure.</p><p><b>Le risque.</b> Se croire immunisé après cette leçon — le biais rétrospectif s'applique aussi… au biais rétrospectif. La seule protection durable est mécanique : écrire avant, relire après. Ce que ton Journal fait déjà.</p>",
exemple:"Dans ton post-mortem de mars : « la baisse de février était évidemment exagérée, j'aurais dû renforcer ». Ton journal, lui, dit qu'en février tu écrivais : « inquiétude : cette baisse pourrait continuer, je préfère attendre ». Les deux phrases sont de toi, à cinq semaines d'écart. Sans journal, la seconde n'aurait jamais existé — et tu te croirais clairvoyant. Avec, tu apprends VRAIMENT.",
quiz:[
{q:"Que fait le biais rétrospectif ?",o:["Il aide à prédire l'avenir","Il réécrit le passé pour rendre les événements « évidents » après coup","Il améliore la mémoire"],b:1,e:"« C'était évident » est presque toujours une illusion : sur le moment, l'évidence n'existait pour presque personne."},
{q:"Pourquoi juger les décisions plutôt que les résultats ?",o:["Parce qu'une décision raisonnable peut mal tourner (et inversement) : seul le raisonnement s'améliore","Parce que les résultats ne comptent pas","Pour se consoler"],b:0,e:"Le hasard brouille les résultats à court terme. En jugeant le processus, tu améliores ce qui dépend de toi."},
{q:"Quelle est l'arme la plus efficace contre ce biais ?",o:["Une excellente mémoire","Le journal horodaté : ce que tu pensais AVANT, écrit noir sur blanc","Suivre les bons gourous"],b:1,e:"On ne peut pas s'empêcher de réécrire ses souvenirs ; on peut s'empêcher de réécrire un document horodaté."}]},

{id:"l45",niveau:6,duree:8,badge:"🗞️",badgeNom:"Rédacteur en chef",titre:"Lire la presse financière sans se faire manipuler",
contenu:"<p><b>Le quoi.</b> La presse financière n'est pas ton conseillère : c'est une industrie de l'ATTENTION. Son incitation n'est pas que tu t'enrichisses, mais que tu cliques, reviennes, t'abonnes. Conséquence structurelle : dramatisation des baisses (« la bourse DÉVISSE », « vent de PANIQUE »), euphorisation des hausses (« l'action que tout le monde s'arrache »), et explications inventées après coup pour chaque mouvement.</p><p><b>Le pourquoi.</b> Chaque jour, les indices bougent — souvent pour rien (bruit statistique, leçon 4). Mais un titre « le CAC 40 a peu bougé pour des raisons peu claires » ne vend pas : le journaliste DOIT trouver une histoire. Résultat : des causalités fabriquées (« la bourse baisse À CAUSE DE X ») qui t'entraînent à voir des liens partout — l'inverse de la rigueur des chaînes causales de ton briefing, qui explicitent le mécanisme et son incertitude.</p><p><b>Le comment — la grille de lecture en 5 réflexes.</b> 1) <b>Traduire les pourcentages</b> : « le CAC s'effondre » = −1,8 % → dans la fourchette d'une journée banale. 2) <b>Chercher l'incitation</b> : qui parle, et que vend-il ? (Un gérant « très optimiste sur sa propre thématique », un site financé par un courtier en CFD…) 3) <b>Se méfier des causalités du jour</b> : la même nouvelle « explique » un jour la hausse, le lendemain la baisse. 4) <b>Fuir les superlatifs</b> : « historique », « du jamais vu », « imminent » — vocabulaire d'audience, pas d'analyse. 5) <b>Remonter à la source primaire</b> : le chiffre officiel, le communiqué, le rapport annuel (leçon 32) — pas leur résumé au troisième degré.</p><p><b>Le risque.</b> Basculer dans le cynisme total (« tout est faux ») et se couper de l'information. La presse de qualité existe et documente les FAITS très bien ; c'est son INTERPRÉTATION à chaud et sa dramatisation qu'il faut filtrer. Les faits, oui ; le frisson, non merci.</p>",
exemple:"Lundi : « Les marchés chutent, inquiets des taux ». Mercredi, mêmes taux : « Les marchés montent, rassurés sur les taux ». La même cause « explique » deux effets opposés en 48 h — parce qu'il ne s'agissait pas d'une explication mais d'un habillage. Ton briefing MENTOR aurait dit : « mouvement de ±1 %, sans catalyseur identifiable : c'est le bruit normal du marché » — moins vendeur, plus vrai.",
quiz:[
{q:"Quelle est l'incitation première d'un média financier grand public ?",o:["Que tu t'enrichisses","Capter ton attention (clics, audience, abonnements)","Éduquer les débutants"],b:1,e:"Ce n'est ni un scandale ni un complot : c'est leur modèle économique. Le comprendre suffit à lire autrement."},
{q:"« La bourse dévisse » pour −1,5 % dans la journée. Réaction saine ?",o:["Vendre avant la catastrophe","Traduire : variation banale, des dizaines par an — poursuivre sa journée","Acheter en urgence"],b:1,e:"Toujours convertir le vocabulaire dramatique en chiffres, puis comparer aux fourchettes normales."},
{q:"Pourquoi se méfier des explications quotidiennes des mouvements de marché ?",o:["Les journalistes mentent toujours","Le marché bouge souvent sans cause identifiable, mais un article DOIT raconter une histoire","Les mouvements n'existent pas"],b:1,e:"La causalité fabriquée après coup est un genre journalistique. Une vraie chaîne causale explicite son mécanisme ET son incertitude."}]},

{id:"l46",niveau:6,duree:9,badge:"🚪",badgeNom:"Sortie maîtrisée",titre:"Quand vendre, vraiment ? L'art le plus difficile",
contenu:"<p><b>Le quoi.</b> On enseigne partout quand acheter ; presque jamais quand vendre. Or la vente concentre les pires erreurs : vendre en panique (le classique), vendre ses gagnants trop tôt (« prendre ses profits ») en gardant ses perdants (aversion à la perte, leçon 17), ou ne JAMAIS vendre par paralysie.</p><p><b>Les 4 bonnes raisons de vendre — et les seules.</b> 1) <b>Ta thèse est invalidée</b> : le critère d'invalidation écrit dans ta thèse (leçon 22) est atteint — tu avais décidé À FROID que ce signal signifierait « je me suis trompé ». Vendre là n'est pas un échec, c'est le SYSTÈME qui fonctionne. 2) <b>Tu as besoin de l'argent</b> pour un projet de vie planifié — c'était même le but. 3) <b>Le rebalancement</b> : une ligne dépasse largement sa place cible (leçon 23) — on taille par discipline, pas par peur. 4) <b>Une meilleure opportunité clairement identifiée</b> — la plus piégeuse : exige une thèse écrite complète sur la nouvelle idée, sinon c'est de l'agitation déguisée.</p><p><b>Les mauvaises raisons (95 % des ventes réelles).</b> « Ça baisse » (si la thèse tient, une baisse est un prix plus intéressant, pas un signal) ; « ça a beaucoup monté » (les grands gagnants de long terme se détruisent à coups de « prises de profit » — couper ses fleurs pour arroser ses mauvaises herbes, disait Peter Lynch) ; « tout le monde vend » (leçon 17) ; « pour faire quelque chose » (l'ennui est un coût de la bonne gestion).</p><p><b>Le comment.</b> Avant CHAQUE vente, le test des 4 raisons : laquelle s'applique ? Aucune → tu es probablement en train d'obéir à une émotion ; applique la règle des 24 h et note ta pulsion au Journal (l'écriture dégonfle les pulsions mieux que la volonté). Et pour les ETF du cœur de portefeuille en phase d'épargne : la réponse à « quand vendre ? » est presque toujours « pas avant ton horizon » — c'est leur beauté.</p>",
exemple:"Position A : +60 %, thèse intacte, 12 % du portefeuille → AUCUNE des 4 raisons : on ne vend pas (même si « prendre ses profits » démange). Position B : −25 %, ET le critère d'invalidation (« perte du client principal ») vient de se réaliser → raison n°1 : on vend, sereinement, en notant la leçon. L'ironie : la plupart des gens font l'inverse — ils vendent A et gardent B « en attendant que ça remonte ».",
quiz:[
{q:"« Mon action a pris 60 %, je prends mes profits. » Bonne raison ?",o:["Oui, toujours sécuriser","Non, pas en soi : si la thèse tient et la ligne reste à sa place, la hausse n'est pas une raison de vendre","Oui si la presse le conseille"],b:1,e:"Couper systématiquement ses gagnants prive des rares très grandes réussites qui font la performance de long terme."},
{q:"Quelle est la vente « noble », signe que ton système fonctionne ?",o:["La vente de panique","La vente sur critère d'invalidation atteint, décidé à froid dans la thèse","La vente pour s'occuper"],b:1,e:"Tu avais défini AVANT ce qui prouverait ton erreur ; c'est arrivé ; tu exécutes. C'est exactement ça, investir en adulte."},
{q:"Une pulsion de vente monte et aucune des 4 raisons ne s'applique. Que faire ?",o:["Vendre vite avant de changer d'avis","Règle des 24 h + écrire la pulsion au Journal","Doubler la position"],b:1,e:"L'écriture transforme une émotion en objet d'analyse. Demain, tu décideras avec le cortex plutôt qu'avec l'amygdale."}]},

{id:"l47",niveau:6,duree:8,badge:"🎢",badgeNom:"Tête froide en sommet",titre:"Gérer les gains : l'euphorie est plus dangereuse que la panique",
contenu:"<p><b>Le quoi.</b> Tout le monde se prépare aux krachs ; presque personne ne se prépare à la HAUSSE. Or les marchés haussiers fabriquent leurs propres poisons : l'excès de confiance (« je suis doué » — non, le marché montait), l'inflation du risque (positions de plus en plus grosses, valeurs de plus en plus spéculatives), l'effet maison du casino (« je ne joue que mes gains »), et l'abandon du plan (« le DCA, c'est pour les débutants »).</p><p><b>Le pourquoi.</b> Les études comportementales sont formelles : les particuliers prennent leurs PIRES décisions en haut de cycle, pas en bas. La panique fait vendre une fois ; l'euphorie fait accumuler pendant des mois des positions surdimensionnées et fragiles — le vrai dégât du krach suivant s'est construit là. Relis la leçon 43 : 1929 s'est joué en 1928.</p><p><b>Le comment — les garde-fous d'un marché qui monte.</b> 1) <b>Attribution honnête</b> : chaque trimestre gagnant, écris au Journal « quelle part vient de mon talent, quelle part de la marée ? » (réponse honnête : surtout la marée). 2) <b>Les seuils mécaniques</b> : l'alerte des 20 % par ligne (déjà dans MENTOR) et le rebalancement annuel deviennent VITAUX en haussier — c'est là qu'ils taillent l'exubérance. 3) <b>Le test de l'inversion</b> : avant chaque nouvel achat euphorique, « si cette position perdait 40 % le mois prochain, mon plan de vie changerait-il ? ». 4) <b>Se méfier de son historique récent</b> : trois bonnes décisions de suite est le moment statistique où l'on prend la mauvaise, en plus gros. 5) Relire son plan (leçon 26) : il a été écrit par ton toi rationnel — l'euphorique n'a pas le droit de le réécrire.</p><p><b>Le risque.</b> Croire que cette leçon concerne les autres. L'euphorie ne se ressent pas comme de l'euphorie : elle se ressent comme de la LUCIDITÉ (« cette fois je comprends le marché »). C'est son génie. Seuls les mécanismes écrits t'en protègent.</p>",
exemple:"Journal de Théo, marché haussier : mars « +8 %, mon analyse paie » ; juin « +19 %, je passe mes positions de 5 % à 12 % chacune, le DCA me semble trop lent » ; septembre « j'ai pris une petite valeur dont tout le monde parle, ça monte déjà ». Décembre : correction de 18 % — ses grosses positions récentes perdent 35 %. La correction était banale ; c'est l'ÉTÉ qui a fait les dégâts. Son post-mortem MENTOR le lui montrera noir sur blanc.",
quiz:[
{q:"Quand les particuliers prennent-ils statistiquement leurs pires décisions ?",o:["Pendant les krachs","En haut de cycle, portés par l'euphorie et l'excès de confiance","En vacances"],b:1,e:"La panique fait une erreur ; l'euphorie en fait accumuler pendant des mois — plus grosses, plus fragiles, plus spéculatives."},
{q:"Le marché a monté et ton portefeuille aussi. Conclusion honnête ?",o:["Je suis doué","Surtout la marée : quand tout monte, tout le monde a « raison »","Il faut accélérer"],b:1,e:"L'attribution honnête (talent vs marée) est l'exercice d'humilité qui prévient l'inflation du risque."},
{q:"Pourquoi l'euphorie est-elle si difficile à détecter en soi-même ?",o:["Elle ne se ressent pas comme une émotion mais comme de la lucidité","Elle n'existe pas","Elle fait mal à la tête"],b:0,e:"« Cette fois je comprends le marché » EST le symptôme. D'où les garde-fous mécaniques : seuils, rebalancement, plan écrit intouchable."}]},

{id:"l48",niveau:6,duree:9,badge:"⏳",badgeNom:"Marathonien",titre:"Tenir 10 ans : le vrai défi n'est pas intellectuel",
contenu:"<p><b>Le quoi.</b> Tout ce que tu as appris tient dans une main ; le défi restant tient en un mot : DURER. Les statistiques sont cruelles : une grande partie des particuliers abandonne dans les 3 premières années — pas ruinés, découragés : premier marché baissier, lassitude des versements, distraction par une mode (crypto du moment, immobilier « facile »), ou simple oubli.</p><p><b>Le pourquoi.</b> Les intérêts composés (leçon 7) ont un profil psychologiquement pervers : les 5 premières années, la boule de neige est DÉCEVANTE (tes versements font l'essentiel, les gains semblent dérisoires) ; la magie n'explose qu'après 10-15 ans — précisément là où la plupart ont abandonné. Réussir en bourse, c'est surtout réussir à s'ennuyer plus longtemps que les autres.</p><p><b>Le comment — l'architecture de la durée.</b> 1) <b>Automatiser à mort</b> : virements programmés, DCA automatique — la meilleure décision est celle qu'on n'a plus à prendre. 2) <b>Ritualiser petit</b> : le briefing MENTOR de 5 minutes est conçu pour ça — un fil quotidien LÉGER vaut mieux que des passions de trois semaines. 3) <b>Prévoir ses absences</b> : tu vas te lasser (grossesse, déménagement, burn-out, vie) — un plan qui survit à 6 mois d'inattention (ETF + virements auto) est un bon plan ; un plan qui exige ta vigilance est une bombe à retardement. 4) <b>Mesurer ce qui motive</b> : pas la performance (déprimante à court terme) mais le patrimoine total versé + le chemin vers ton chiffre de la leçon 42. 5) <b>Les rituels MENTOR longs</b> : post-mortem hebdo, bilan mensuel, inventaire annuel — trois boucles qui te ramènent doucement quand tu dérives.</p><p><b>Le risque.</b> Confondre intensité et constance. L'investisseur qui passe 20 h/semaine sur les marchés la première année puis plus rien perd contre celui qui y passe 15 minutes par semaine pendant vingt ans. La bourse est l'un des rares domaines où l'ennui est un avantage compétitif.</p>",
exemple:"Deux trajectoires, 200 €/mois à 6 %/an. Enzo, passionné : 18 mois intensifs, puis lassitude, arrêt des versements, revend tout à −12 % en 2029 « déçu ». Total : une expérience amère. Inès, automatisée : virements programmés, 5 min de briefing par jour, deux baisses de 20 % traversées « sans regarder ». Après 20 ans : ≈ 92 000 €, dont 44 000 € de gains. La différence entre eux n'était ni l'intelligence ni le capital : c'était l'architecture.",
quiz:[
{q:"Pourquoi les 5 premières années d'épargne sont-elles psychologiquement difficiles ?",o:["Les marchés baissent toujours au début","La boule de neige paraît dérisoire : les versements dominent, les gains semblent minuscules","À cause des impôts"],b:1,e:"La composition est exponentielle : plate au début, explosive après 10-15 ans. Ceux qui jugent à 3 ans abandonnent juste avant la pente."},
{q:"Quelle est la caractéristique d'un plan qui DURE ?",o:["Il exige une vigilance quotidienne","Il survit à 6 mois d'inattention totale grâce à l'automatisation","Il change chaque mois"],b:1,e:"La vie te distraira, c'est certain. Virements automatiques + ETF diversifiés = un plan qui travaille pendant que tu vis."},

{id:"l49",niveau:6,duree:8,badge:"🤝",badgeNom:"Passeur",titre:"Parler d'argent aux proches : aider sans jouer au gourou",

/* Fusion défensive : si le schéma évolue, les nouvelles clés apparaissent
   sans écraser les données existantes. */
function fusionDefaut(def,obj){
  if(obj===null||typeof obj!=="object"||Array.isArray(obj)) return obj!==undefined?obj:def;
  const res=Array.isArray(def)?obj:{...def};
  for(const k in def){ if(obj[k]===undefined) res[k]=def[k]; else res[k]=fusionDefaut(def[k],obj[k]); }
  for(const k in obj){ if(res[k]===undefined) res[k]=obj[k]; }
  return res;
}
let S;
function charger(){
  try{
    const brut=localStorage.getItem("mentor_v1");
    S=brut?fusionDefaut(etatDefaut(),JSON.parse(brut)):etatDefaut();
  }catch(e){ S=etatDefaut(); }
}

/* ---- Glossaire : soulignement automatique des termes ----
   On parcourt le texte et on enveloppe la première famille d'occurrences
   de chaque terme connu. Appliqué aux réponses de l'IA et aux leçons. */
const _termesTriees=Object.keys(GLOSSAIRE).sort((a,b)=>b.length-a.length);
function lierTermes(html){
  if(!html) return "";
  // On ne touche qu'au texte hors balises pour ne pas casser le HTML.
  const morceaux=String(html).split(/(<[^>]*>)/);
  const deja=new Set();
  for(let i=0;i<morceaux.length;i++){
    if(morceaux[i].startsWith("<")) continue;
    let txt=morceaux[i];
    // Les spans déjà insérés sont mis de côté sous forme de jetons \x00n\x00 :
    // sans cela, un terme court (« ETF ») pourrait matcher À L'INTÉRIEUR du
    // HTML d'un terme long déjà lié (« ETF capitalisant ») et casser la page.
    const reserves=[];
    for(const terme of _termesTriees){
      if(deja.has(terme)) continue;
      const re=new RegExp("(^|[^\\wÀ-ÿ-])("+terme.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(s?)(?=$|[^\\wÀ-ÿ-])","i");
      if(re.test(txt)){
        txt=txt.replace(re,(m,av,mot,pl)=>{
          const id=reserves.length;
          reserves.push('<span class="terme" data-terme="'+ech(terme)+'">'+mot+pl+"</span>");
          return av+"\x00"+id+"\x00";
        });
        deja.add(terme);
      }
    }
    morceaux[i]=txt.replace(/\x00(\d+)\x00/g,(m,id)=>reserves[+id]);
  }
  return morceaux.join("");
}
function afficherDefinition(terme){
  const def=GLOSSAIRE[terme]; if(!def) return;
  ouvrirSheet(titreSheet(terme.charAt(0).toUpperCase()+terme.slice(1))+
    '<p style="font-size:16px;line-height:1.6">'+ech(def)+'</p>'+
    '<button class="btn secondaire mHaut" onclick="fermerSheet();ongletActif=\'ecole\';vueEcole=\'glossaire\';rendre()">Ouvrir le glossaire complet</button>');
}
// Délégation globale : un tap sur n'importe quel terme souligné ouvre sa définition.
document.addEventListener("click",(e)=>{
  const t=e.target.closest(".terme");
  if(t&&t.dataset.terme) afficherDefinition(t.dataset.terme);
});

/* ---- Markdown minimal pour les réponses de chat de l'IA ---- */
function mdVersHtml(txt){
  let h=ech(txt||"");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*\n]+)\*/g,"<i>$1</i>");
  h=h.replace(/^### (.+)$/gm,"<b>$1</b>").replace(/^## (.+)$/gm,"<b>$1</b>").replace(/^# (.+)$/gm,"<b>$1</b>");
  h=h.replace(/^[-•] (.+)$/gm,"— $1");
  h=h.replace(/\n\n+/g,"</p><p>").replace(/\n/g,"<br>");
  return "<p>"+h+"</p>";
}

/* ---------- Appel Gemini (fournisseur par défaut, niveau gratuit) ----------
   Google renomme et retire régulièrement ses modèles (ex. gemini-2.5-flash,
   fermé aux nouvelles clés en 2026 → erreur 404). L'app ne fige donc JAMAIS
   un nom de modèle : elle essaie une liste de candidats, mémorise celui qui
   répond, et en dernier recours interroge ListModels pour découvrir
   elle-même un modèle Flash disponible. */
const MODELES_GEMINI=["gemini-flash-latest","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"];
function modeleGeminiActuel(){ return (S.reglages&&S.reglages.modeleGemini)||MODELES_GEMINI[0]; }
async function appelGemini(systeme,utilisateur,opts){
  opts=opts||{};
  const candidats=[modeleGeminiActuel(),...MODELES_GEMINI.filter(m=>m!==modeleGeminiActuel())];
  let erreur404=null;
  for(const m of candidats){
    try{
      const texte=await appelGeminiModele(m,systeme,utilisateur,opts);
      if(S.reglages.modeleGemini!==m){ S.reglages.modeleGemini=m; sauver(); }
      return texte;
    }catch(e){
      if(e&&e.statut===404){ erreur404=e; continue; } // modèle retiré → candidat suivant
      throw e;
    }
  }
  // Dernier recours : demander à l'API la liste des modèles réellement disponibles.
  const decouvert=await decouvrirModeleGemini();
  if(decouvert){
    const texte=await appelGeminiModele(decouvert,systeme,utilisateur,opts);
    S.reglages.modeleGemini=decouvert; sauver();
    return texte;
  }
  throw erreur404||new Erreur429Friendly("Aucun modèle Gemini disponible avec cette clé. Réessaie plus tard, ou vérifie ta clé dans Profil.");
}
async function decouvrirModeleGemini(){
  try{
    const rep=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key="+encodeURIComponent(S.cles.gemini));
    if(!rep.ok) return null;
    const data=await rep.json();
    const utilisables=(data.models||[]).filter(m=>
      (m.supportedGenerationMethods||[]).includes("generateContent")&&
      /flash/i.test(m.name)&&!/image|live|tts|audio|embedding|robotics/i.test(m.name));
    // Préférence : flash « plein » plutôt que lite, et le plus récent d'abord.
    utilisables.sort((a,b)=>(/lite/i.test(a.name)?1:0)-(/lite/i.test(b.name)?1:0)||b.name.localeCompare(a.name));
    return utilisables.length?utilisables[0].name.replace(/^models\//,""):null;
  }catch(e){ return null; }
}
async function appelGeminiModele(modele,systeme,utilisateur,opts){
  opts=opts||{};
  const cle=S.cles.gemini;
  if(!cle) throw new Erreur429Friendly("Aucune clé Gemini enregistrée. Va dans Profil → Clés API.");
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(modele)+":generateContent?key="+encodeURIComponent(cle);
  const contents=(opts.historique||[]).map(m=>({role:m.role==="ia"?"model":"user",parts:[{text:m.texte}]}));
  contents.push({role:"user",parts:[{text:utilisateur}]});
  const corps={
    systemInstruction:{parts:[{text:systeme}]},
    contents:contents,
    generationConfig:{temperature:opts.temperature==null?0.7:opts.temperature,maxOutputTokens:8192}
  };
  // Recherche Google intégrée : l'IA fait elle-même ses recherches d'actualité.
  if(opts.recherche!==false) corps.tools=[{google_search:{}}];
  const rep=await fetchAvecBackoff(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(corps)},opts.surEtape,opts.delais);
  const data=await rep.json();
  const parts=data&&data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts;
  const texte=(parts||[]).map(p=>p.text||"").join("");
  if(!texte) throw new Error("Réponse vide de l'IA. Réessaie dans un instant.");
  return texte;
}

  return texte;

function Erreur429Friendly(msg){ const e=new Error(msg); e.friendly=true; return e; }

/* Backoff exponentiel sur 429/503 : 3 tentatives (2 s, 5 s, 12 s),
   puis message vulgarisé — jamais d'erreur brute à l'écran.
   `delais` est paramétrable : les appels AVEC recherche Google n'insistent
   pas (1 seule attente courte) car leur 429 vient presque toujours du quota
   grounding, qui ne se libère pas en quelques secondes. */
async function fetchAvecBackoff(url,options,surEtape,delais){
  delais=delais||[2000,5000,12000];
  for(let t=0;t<=delais.length;t++){
    let rep;
    try{ rep=await fetch(url,options); }
    catch(e){ throw new Erreur429Friendly("Impossible de joindre le serveur. Vérifie ta connexion internet et réessaie."); }
    if(rep.ok) return rep;
    if((rep.status===429||rep.status===503||rep.status===500)&&t<delais.length){
      if(surEtape) surEtape("L'IA est très sollicitée… nouvelle tentative dans "+(delais[t]/1000)+" s");
      await new Promise(r=>setTimeout(r,delais[t]));
      continue;
    }
    const lancer=(msg)=>{ const e=new Erreur429Friendly(msg); e.statut=rep.status; throw e; };
    if(rep.status===429) lancer("L'IA a atteint sa limite gratuite du moment. Ce n'est pas grave : réessaie dans quelques minutes (si le quota du JOUR est épuisé, il se remet à zéro vers 9 h du matin, heure française).");
    if(rep.status===404) lancer("Le modèle d'IA demandé n'existe plus chez le fournisseur."); // intercepté par la bascule automatique de modèle
    if(rep.status===400||rep.status===401||rep.status===403){
      let det=""; try{ const j=await rep.json(); det=(j.error&&j.error.message)||""; }catch(e){}
      if(/key|API_KEY|auth/i.test(det)||rep.status===401||rep.status===403)
        lancer("La clé API semble invalide ou incomplète. Vérifie-la dans Profil → Clés API (elle a peut-être été mal collée).");
      lancer("La demande a été refusée par le service ("+rep.status+"). Réessaie, et si ça persiste, vérifie ta clé dans Profil.");
    }
    lancer("Le service répond avec une erreur ("+rep.status+"). Réessaie dans quelques minutes.");
  }
}

/* Point d'entrée unique : bascule selon le fournisseur choisi.
   DÉGRADATION GRACIEUSE DE LA RECHERCHE : sur le niveau gratuit de Gemini,
   l'outil google_search a son propre quota, bien plus bas que celui de
   l'IA (parfois zéro selon les comptes). Un 429 sur un appel AVEC recherche
   vient donc presque toujours du grounding, pas du modèle. Dans ce cas :
   on mémorise que la recherche est épuisée pour la journée et on relance
   le même appel SANS recherche, en informant l'IA (et l'utilisateur) que
   les informations peuvent dater. Nouvel essai automatique le lendemain. */
let _derniereGenerationSansRecherche=false;
function rechercheEpuiseeAujourdhui(){ return S.reglages.rechercheKoJour===aujourdhuiISO(); }
const NOTE_SANS_RECHERCHE="\n\nNOTE TECHNIQUE IMPORTANTE : la recherche Google est indisponible pour cet appel (quota gratuit atteint). Appuie-toi uniquement sur tes connaissances générales : PRÉVIENS clairement ton élève que tu n'as pas accès à l'actualité du jour et que tes informations peuvent dater, ne prétends JAMAIS citer des nouvelles d'aujourd'hui, n'invente aucun cours de bourse ni aucune source, et si un cours de clôture t'est demandé (cloture_euronext), renvoie un tableau vide.";
async function appelIA(systeme,utilisateur,opts){
  opts=opts||{};
  if(!navigator.onLine) throw new Erreur429Friendly("Tu es hors connexion. Le briefing et le chat ont besoin d'internet — les leçons et ton journal restent disponibles.");
  _derniereGenerationSansRecherche=false;
  const fournisseur=(u,o)=>S.cles.fournisseurIA==="claude"?appelClaude(systeme,u,o):appelGemini(systeme,u,o);
  const veutRecherche=opts.recherche!==false;
  if(veutRecherche&&!rechercheEpuiseeAujourdhui()){
    try{
      // 1 seule attente courte : si le quota grounding est vide, insister ne sert à rien.
      return await fournisseur(utilisateur,{...opts,recherche:true,delais:[2500]});
    }catch(e){
      if(e.statut!==429) throw e;
      S.reglages.rechercheKoJour=aujourdhuiISO(); sauver();
      if(opts.surEtape) opts.surEtape("Le quota gratuit de recherche Google est atteint — je continue sans elle");
    }
  }
  if(veutRecherche){ _derniereGenerationSansRecherche=true; utilisateur+=NOTE_SANS_RECHERCHE; }
  return fournisseur(utilisateur,{...opts,recherche:false});
}

/* ---------- Parsing JSON robuste (l'IA entoure parfois de ```json) ---------- */
function extraireJSON(texte){
  let t=String(texte||"").trim();
  t=t.replace(/```json/gi,"```");
  const bloc=t.match(/```([\s\S]*?)```/);
  if(bloc) t=bloc[1].trim();
  const deb=t.indexOf("{"),fin=t.lastIndexOf("}");
  if(deb<0||fin<=deb) throw new Error("format");
  t=t.slice(deb,fin+1);
  try{ return JSON.parse(t); }
  catch(e){
    // Réparations courantes : virgules terminales, guillemets typographiques.
    t=t.replace(/,\s*([}\]])/g,"$1").replace(/[“”]/g,'"').replace(/[‘’]/g,"'");
    return JSON.parse(t);
  }
}
/* Appel IA avec sortie JSON attendue : jusqu'à 2 tentatives de re-génération
   si le JSON est illisible (robustesse exigée pour le briefing). */
async function appelIAJson(systeme,utilisateur,opts){
  let derniereErreur=null;
  for(let t=0;t<2;t++){
    const texte=await appelIA(systeme,utilisateur,opts);
    try{ return extraireJSON(texte); }
    catch(e){ derniereErreur=e;
      utilisateur+="\n\nRAPPEL CRITIQUE : ta précédente réponse n'était pas un JSON valide. Réponds UNIQUEMENT avec l'objet JSON demandé, sans aucun texte autour.";
    }
  }
  throw new Erreur429Friendly("L'IA a répondu dans un format inattendu. Relance la génération — ça arrive parfois, surtout aux heures de pointe.");
}

/* ============================================================
   TWELVE DATA — cours temps réel US, historiques, devises.
   Quotas gratuits : 8 requêtes/minute, 800/jour.
   → cache systématique, requêtes groupées, jamais de polling.
   ============================================================ */
const TD_BASE="https://api.twelvedata.com";
let _tdHorodatages=[]; // horodatages des requêtes de la dernière minute
function tdQuotaOk(){ const now=Date.now(); _tdHorodatages=_tdHorodatages.filter(t=>now-t<61000); return _tdHorodatages.length<8; }
async function tdRequete(chemin,params,surEtape){
  const cle=S.cles.twelveData;
  if(!cle) throw new Erreur429Friendly("Aucune clé Twelve Data enregistrée. Va dans Profil → Clés API.");
  if(!tdQuotaOk()){
    if(surEtape) surEtape("Respect du quota gratuit (8 requêtes/min)… petite pause");
    await new Promise(r=>setTimeout(r,9000));
  }
  _tdHorodatages.push(Date.now());
  const q=Object.entries(params||{}).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  const rep=await fetchAvecBackoff(TD_BASE+chemin+"?"+q+"&apikey="+encodeURIComponent(cle),{},surEtape);
  const data=await rep.json();
  if(data&&data.status==="error"){
    if(data.code===429) throw new Erreur429Friendly("Le service de cours a atteint sa limite gratuite de la minute. Réessaie dans 1 minute.");
    if(data.code===401||/apikey/i.test(data.message||"")) throw new Erreur429Friendly("La clé Twelve Data semble invalide. Vérifie-la dans Profil → Clés API.");
    throw new Erreur429Friendly("Le service de cours a renvoyé une erreur : "+(data.message||"inconnue"));
  }
  return data;
}
/* Cotations groupées avec cache : une seule requête pour N symboles US.
   Durée de cache paramétrée (15 min par défaut) : la fraîcheur à la seconde
   n'a AUCUNE valeur pédagogique pour un investisseur de long terme. */
async function cotations(symbols,force,surEtape){
  const aChercher=[];
  const maxAge=(S.reglages.cacheMinutes||15)*60000;
  for(const s of symbols){
    const c=S.coursCache[s];
    if(force||!c||c.source!=="twelvedata"||Date.now()-new Date(c.horodatage).getTime()>maxAge) aChercher.push(s);
  }
  if(aChercher.length){
    // L'API accepte les symboles groupés séparés par des virgules : 1 requête = N cours.
    const data=await tdRequete("/quote",{symbol:aChercher.join(",")},surEtape);
    const parSymbole=aChercher.length===1?{[aChercher[0]]:data}:data;
    for(const s of aChercher){
      const d=parSymbole[s];
      if(d&&d.close){
        S.coursCache[s]={prix:parseFloat(d.close),variation:parseFloat(d.percent_change||0),devise:d.currency||"USD",source:"twelvedata",horodatage:new Date().toISOString(),nom:d.name||s};
      }
    }
    sauver();
  }
  return symbols.map(s=>S.coursCache[s]||null);
}
/* Historique pour les graphiques (30 points journaliers, caché 12 h). */
async function historique(symbole,surEtape){
  const cle="_h_"+symbole;
  const c=S.coursCache[cle];
  if(c&&Date.now()-new Date(c.horodatage).getTime()<12*3600000) return c.serie;
  const data=await tdRequete("/time_series",{symbol:symbole,interval:"1day",outputsize:30},surEtape);
  const serie=(data.values||[]).map(v=>({d:v.datetime,c:parseFloat(v.close)})).reverse();
  S.coursCache[cle]={serie:serie,horodatage:new Date().toISOString(),source:"twelvedata"};
  sauver();
  return serie;
}
/* Recherche de symbole (aide à la saisie de position). */
async function chercherSymbole(texte){
  const data=await tdRequete("/symbol_search",{symbol:texte,outputsize:8});
  return (data.data||[]).map(d=>({symbol:d.symbol,nom:d.instrument_name,bourse:d.exchange,devise:d.currency,pays:d.country}));
}
/* Symboles Euronext (plan gratuit Twelve Data : non couverts) :
   les clôtures de veille sont récupérées par la recherche de l'IA au
   moment du briefing (voir promptBriefing), horodatées « Clôture du JJ/MM ». */
function estEuronext(p){ return p.marche==="euronext"||/\.(PA|AS|BR|LS)$/i.test(p.ticker); }
function symbolesUS(){
  const tous=[...S.positionsReelles,...S.positionsVirtuelles,...S.watchlist];
  const set=new Set();
  tous.forEach(p=>{ if(!estEuronext(p)) set.add(p.ticker); });
  return [...set];
}
async function rafraichirCours(force,surEtape){
  const us=symbolesUS();
  // Le taux EUR/USD accompagne chaque rafraîchissement : il sert à convertir
  // les positions en dollars pour afficher des totaux justes en euros.
  if(us.length) await cotations(us.concat(["EUR/USD"]),force,surEtape);
}
/* Conversion en euros (les cours US sont en dollars). Repli prudent : dernier
   taux connu, sinon 1,08 $ pour 1 € (ordre de grandeur récent) en attendant
   le premier rafraîchissement. */
function enEUR(montant,devise){
  if(devise!=="USD") return montant;
  const t=S.coursCache["EUR/USD"];
  const taux=t&&t.prix?t.prix:1.08;
  return montant/taux;
}

  btn.disabled=true; btn.textContent="Test en cours…";

/* ---- Fin du questionnaire : calculs locaux puis premier appel IA ---- */
function obTerminerQuestionnaire(){
  const r=S.profil.reponses;
  // Niveau mesuré (0-5) au quiz d'entrée.
  S.profil.niveauMesure=QUIZ_ENTREE.reduce((n,q,i)=>n+(r["quiz"+i]===String(q.b)?1:0),0);
  // Tolérance synthétique — sert au prompt.
  const scores={vends:0,attends:1,renforce:2,fomo:0,curieux:1,mefiant:2,securite:0,equilibre:1,dynamique:2};
  const tol=(scores[r.risque1]||0)+(scores[r.risque2]||0)+(scores[r.risque3]||0);
  r.tolerance=tol<=1?"très prudente":tol<=3?"prudente":tol<=4?"équilibrée":"dynamique";
  r.enveloppes=[]; if(r.etoro!=="non")r.enveloppes.push("eToro"); if(r.bourso!=="non")r.enveloppes.push("CTO Boursorama"); if(r.pea==="oui")r.enveloppes.push("PEA");
  // MODE PROTÉGÉ : épargne de précaution < 3 mois → le réel reste verrouillé.
  S.profil.modeProtege=(r.matelas==="<3 mois");
  // Capital virtuel = ce que l'utilisateur compte investir réellement (milieu de fourchette).
  const capitaux={"Moins de 500 €":300,"500 à 1 500 €":1000,"1 500 à 5 000 €":3000,"5 000 à 15 000 €":10000,"Plus de 15 000 €":20000};
  S.capitalVirtuel=capitaux[r.montantDepart]||1000;
  S.liquiditesVirtuelles=S.capitalVirtuel;
  const dca={"Moins de 50 €/mois":30,"50 à 100 €/mois":75,"100 à 300 €/mois":200,"300 à 600 €/mois":450,"Plus de 600 €/mois":700};
  S.reglages.dcaMontant=dca[r.capacite]||75;
  sauver();
  obGenererPlan();
}

function regenererBriefingDuJour(){
  // On efface le briefing du jour ET les idées qu'il avait archivées au journal

  delete S.reglages.rechercheKoJour;

}

async function lancerBriefing(){
  if(_briefingEnCours) return;
  _briefingEnCours=true; rendre();
  const etapes=["Je consulte l'actualité…","Je cherche les cours de clôture…","J'analyse ton portefeuille…","Je remonte les chaînes causales…","Je rédige ton briefing…"];
  let i=0; const anim=setInterval(()=>{ const el=$("#etapeChargeur"); if(el&&i<etapes.length-1) el.textContent=etapes[++i]; },4200);
  try{
    // 1. Cours US frais avant l'analyse (cache-friendly, quota respecté).
    try{ await rafraichirCours(false,m=>{const el=$("#etapeChargeur");if(el)el.textContent=m;}); }catch(e){}
    // 2. Appel IA avec recherche Google.
    const contenu=await genererBriefing(m=>{const el=$("#etapeChargeur");if(el)el.textContent=m;});
    // 3. Archivage complet (avec les cours du moment) + journal des idées.
    const fige={}; Object.keys(S.coursCache).forEach(k=>{ if(!k.startsWith("_h_")) fige[k]=S.coursCache[k]; });
    S.briefings.push({date:aujourdhuiISO(),genereLe:new Date().toISOString(),contenu:contenu,coursAlors:fige});
    if(S.briefings.length>60) S.briefings=S.briefings.slice(-60);
    (contenu.idees||[]).forEach(idee=>{
      const c=S.coursCache[idee.ticker];
      journalAjouter({type:"idee_ia",ticker:idee.ticker,action:idee.action,these:idee.these,ce_qui_confirme:idee.ce_qui_confirme,ce_qui_invalide:idee.ce_qui_invalide,horizon:idee.horizon,risque:idee.risque,coursAlors:c?c.prix+" "+(c.devise||""):null});
    });
    marquerJourJournal();
    sauver();
  }catch(err){
    clearInterval(anim); _briefingEnCours=false; rendre();
    toast("😕 "+(err.friendly?err.message:"La génération a échoué, réessaie."),4000);
    return;
  }
  clearInterval(anim); _briefingEnCours=false; rendre();
}

async function envoyerQuestion(qForcee){
  if(_chatEnCours) return;

let vuePortefeuille="virtuel"; // le débutant démarre en virtuel : c'est sa phase 1

function coursDe(p){ const c=S.coursCache[p.ticker]; return c&&c.prix?c:null; }
/* Valeurs exprimées en euros (conversion des lignes en dollars via EUR/USD). */
function valeurPosition(p){ const c=coursDe(p); return enEUR(c?c.prix*p.quantite:p.pru*p.quantite,p.devise); }
function valeurTotale(liste){ return liste.reduce((s,p)=>s+valeurPosition(p),0); }
function plusValue(p){ const c=coursDe(p); if(!c)return null; return enEUR((c.prix-p.pru)*p.quantite,p.devise); }

/* Score de diversification simple, calculé localement :
   pénalise la concentration (indice de Herfindahl inversé) + bonus multi-zones.
   But pédagogique : donner un ordre de grandeur parlant, pas une mesure savante. */
function scoreDiversification(liste){
  if(liste.length===0) return null;
  const tot=valeurTotale(liste); if(tot<=0) return null;
  const herf=liste.reduce((s,p)=>{ const w=valeurPosition(p)/tot; return s+w*w; },0);
  let score=Math.round((1-herf)*100);
  const zones=new Set(liste.map(p=>estEuronext(p)?"eu":"us"));
  const etf=liste.some(p=>/etf|world|s&p|msci|cac|nasdaq/i.test(p.nom||""));
  if(zones.size>1) score=Math.min(100,score+10);
  if(etf) score=Math.min(100,score+15);
  return score;
}

/* Graphique SVG maison — sobre, sans bougies néon. */
function dessinerGraphique(serie){
  if(!serie||serie.length<2) return '<p class="petit">Pas assez de données.</p>';
  const W=280,H=90,vals=serie.map(s=>s.c),min=Math.min(...vals),max=Math.max(...vals),amp=(max-min)||1;
  const pts=serie.map((s,i)=>[(i/(serie.length-1))*W,H-8-((s.c-min)/amp)*(H-16)]);
  const chemin=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const monte=vals[vals.length-1]>=vals[0];
  const coul=monte?"#3E7A5E":"#A65D57";
  return '<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto"><path d="'+chemin+" L"+W+","+H+" L0,"+H+' Z" fill="'+coul+'18"/><path d="'+chemin+'" fill="none" stroke="'+coul+'" stroke-width="2" stroke-linejoin="round"/></svg>';
}

let _csvLignes=null,_csvColonnes=null;
function lireCSV(fichier){
  if(!fichier) return;
  const lecteur=new FileReader();
  lecteur.onload=()=>{
    // Format Boursorama : séparateur « ; », décimales à virgule, en-têtes français.
    const texte=String(lecteur.result);
    const sep=texte.split("\n")[0].includes(";")?";":",";
    const lignes=texte.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,"").trim()));
    if(lignes.length<2){ $("#apercuCSV").innerHTML='<div class="encart danger">Fichier vide ou illisible.</div>'; return; }
    _csvColonnes=lignes[0]; _csvLignes=lignes.slice(1);
    const devine=(mots)=>{ const ix=_csvColonnes.findIndex(c=>mots.some(m=>c.toLowerCase().includes(m))); return ix<0?0:ix; };
    const sel=(id,def)=>'<select class="champ" id="'+id+'">'+_csvColonnes.map((c,i)=>'<option value="'+i+'"'+(i===def?" selected":"")+">"+ech(c)+"</option>").join("")+"</select>";
    $("#apercuCSV").innerHTML='<p class="petit">'+_csvLignes.length+' lignes détectées. Vérifie la correspondance des colonnes :</p>'+
      '<label class="etiquette">Colonne « valeur / libellé »</label>'+sel("mapNom",devine(["libell","valeur","nom","désignation","designation"]))+
      '<label class="etiquette">Colonne « ticker / code »</label>'+sel("mapTicker",devine(["ticker","code","isin","symbole","mnémo","mnemo"]))+
      '<label class="etiquette">Colonne « quantité »</label>'+sel("mapQte",devine(["quantit","qté","qte","nombre"]))+
      '<label class="etiquette">Colonne « prix de revient / PRU »</label>'+sel("mapPru",devine(["revient","pru","prix moyen","pam"]))+
      '<button class="btn mHaut" onclick="importerCSV()">Importer ces positions</button>';
  };
  lecteur.readAsText(fichier,"utf-8");
}
function importerCSV(){
  const ix={nom:+$("#mapNom").value,ticker:+$("#mapTicker").value,qte:+$("#mapQte").value,pru:+$("#mapPru").value};
  let ok=0;
  _csvLignes.forEach(l=>{
    const nb=(v)=>parseFloat(String(v||"").replace(/\s/g,"").replace(",","."));
    const t=(l[ix.ticker]||"").toUpperCase().trim(),q=nb(l[ix.qte]),pru=nb(l[ix.pru]);
    if(!t||!q||!pru) return;
    const ticker=/^[A-Z0-9]{1,6}$/.test(t)&&!/\./.test(t)?t+".PA":t; // heuristique : codes Boursorama = Euronext Paris
    S.positionsReelles.push({id:idUnique(),ticker:ticker,nom:l[ix.nom]||ticker,quantite:q,pru:pru,devise:"EUR",courtier:"Boursorama",dateAchat:aujourdhuiISO(),marche:"euronext"});
    ok++;
  });

}

function majSimu(){
  const m=parseFloat(($("#simMensuel").value||"0").replace(",","."))||0;
  const t=(parseFloat(($("#simTaux").value||"0").replace(",","."))||0)/100/12;
  const annees=+$("#simDuree").value;
  $("#simDureeLbl").textContent=annees;
  const n=annees*12;
  const final=t>0?m*((Math.pow(1+t,n)-1)/t):m*n;
  const verse=m*n;
  $("#simResultat").innerHTML='<div class="heroChiffre" style="font-size:30px">'+fmtEUR(final,0)+'</div><p class="petit">dont '+fmtEUR(verse,0)+' versés par toi et <b class="varHausse">'+fmtEUR(final-verse,0)+"</b> produits par la boule de neige</p>";
}

function simEtat(){ if(!S.simulateur) S.simulateur={enCours:null,finies:[]}; return S.simulateur; }
function nomMoisSim(sim,mois,mystere){
  if(mystere) return "Mois "+(mois+1)+" / "+sim.valeurs.length;
  const [a,m]=sim.debut.split("-").map(Number);
  const d=new Date(a,m-1+mois,1);
  return d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
}
/* Une « une » générique dérivée des données : utilisée en mode mystère
   pour donner l'ambiance sans révéler l'époque (anti-biais rétrospectif). */
function uneGenerique(sim,mois){
  const v=sim.valeurs, picPasse=Math.max(...v.slice(0,mois+1)), cur=v[mois];
  const varMois=mois>0?(cur/v[mois-1]-1)*100:0, drawdown=(cur/picPasse-1)*100;
  if(varMois<=-12) return "Les journaux parlent de « panique historique ». Certains prédisent la fin du système.";
  if(varMois<=-6) return "Chute brutale ce mois-ci. Les unes sont anxiogènes, les experts se contredisent.";
  if(drawdown<=-40) return "Le pessimisme est total : « les actions, plus jamais », titre la presse. Les volumes s'assèchent.";
  if(drawdown<=-20) return "La baisse s'éternise. Ton entourage te demande si « tu as vu tes pertes ». L'ambiance est lourde.";
  if(varMois>=8) return "Rebond spectaculaire ! Ceux qui ont vendu s'arrachent les cheveux ; les autres n'osent pas y croire.";
  if(mois>2&&cur>=picPasse*0.99&&varMois>1.5) return "Records en série. Tout le monde parle de bourse au déjeuner — et chacun a un tuyau.";
  if(varMois>=3) return "Beau mois de hausse. L'optimisme revient doucement dans les journaux.";
  if(Math.abs(varMois)<1.5) return "Mois calme. Les marchés flottent, la presse s'ennuie et parle d'autre chose.";
  return varMois<0?"Mois hésitant, plutôt baissier. Rien de dramatique, mais le doute s'installe.":"Mois légèrement haussier, sans conviction particulière.";
}
