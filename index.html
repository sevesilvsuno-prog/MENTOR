LECONS.push(
{id:"l14",niveau:2,duree:6,badge:"💶",badgeNom:"Récolteur",titre:"Les dividendes : le loyer de tes actions",
contenu:"<p><b>Le quoi.</b> Le dividende est la part des bénéfices qu'une entreprise décide de verser à ses actionnaires, en général une ou plusieurs fois par an. Toutes ne le font pas : les entreprises en forte croissance préfèrent souvent tout réinvestir.</p><p><b>Le pourquoi.</b> Le dividende est un revenu tangible et régulier — psychologiquement précieux. Mais attention au piège d'optique : le jour du versement, le cours de l'action baisse mécaniquement du montant versé (« détachement »). Le dividende n'est pas de l'argent gratuit : c'est un morceau de la valeur de l'entreprise qui passe dans ta poche… et devient imposable.</p><p><b>Le comment.</b> Le « rendement du dividende » = dividende annuel ÷ cours (ex. 3 € ÷ 60 € = 5 %). Méfiance au-dessus de 8 % : c'est souvent le signe d'un cours effondré ou d'un dividende insoutenable — un piège classique appelé « value trap ». À long terme, les ETF capitalisants (qui réinvestissent les dividendes automatiquement) sont fiscalement plus efficaces : pas d'imposition tant qu'on ne vend pas.</p><p><b>Le risque.</b> Un dividende n'est jamais garanti : l'entreprise peut le réduire ou le supprimer du jour au lendemain (des dizaines l'ont fait en 2020). Construire son plan sur des dividendes « sûrs » est une illusion.</p>",
exemple:"Action à 100 €, dividende de 4 €. La veille du détachement, tu as une action à 100 €. Le lendemain : une action à ≈ 96 € + 4 € en espèces (imposables à 30 % sur CTO, soit 2,80 € nets). Ta richesse n'a pas augmenté d'un centime — elle a juste changé de forme, et le fisc est passé.",
quiz:[
{q:"Que se passe-t-il mécaniquement le jour du versement d'un dividende ?",o:["Le cours monte du montant du dividende","Le cours baisse du montant du dividende","Rien"],b:1,e:"La valeur versée sort de l'entreprise : le cours se détache d'autant. Le dividende n'est pas un bonus magique."},
{q:"Un rendement de dividende de 12 %, c'est…",o:["Une affaire en or à saisir","Souvent un signal d'alarme","La moyenne du marché"],b:1,e:"Un rendement si élevé traduit souvent un cours effondré ou un dividende condamné : le fameux « piège à rendement »."},
{q:"Pour du long terme, quel choix est fiscalement le plus efficace ?",o:["ETF distribuant","ETF capitalisant","Toucher les dividendes en espèces"],b:1,e:"Le capitalisant réinvestit sans passage par la case impôt : la boule de neige roule sans friction."}]},

{id:"l15",niveau:2,duree:7,badge:"📈",badgeNom:"Œil critique",titre:"Lire un graphique sans se raconter d'histoires",
contenu:"<p><b>Le quoi.</b> Un graphique de cours montre le passé d'un prix. Il ne contient AUCUNE information certaine sur l'avenir — c'est la première chose à graver dans sa mémoire.</p><p><b>Le pourquoi.</b> Notre cerveau est une machine à voir des motifs, même dans le hasard pur (les nuages, les constellations… les courbes). Des études ont montré que des investisseurs « détectent des tendances » dans des graphiques générés aléatoirement. Les figures de l'analyse technique (« épaule-tête-épaule », « support », « résistance ») n'ont jamais démontré de pouvoir prédictif fiable.</p><p><b>Le comment.</b> Utilise les graphiques pour ce qu'ils savent faire : situer le présent (le cours est-il proche de ses sommets ? a-t-il déjà beaucoup baissé ?), mesurer la volatilité (amplitude des vagues), comparer des périodes longues. Réflexes : toujours regarder 5 ans ET 6 mois (le zoom change tout le récit), vérifier si l'échelle commence à zéro (une courbe « spectaculaire » est souvent un zoom trompeur), se méfier de l'extrapolation (« ça monte depuis 3 mois donc ça va continuer » — non).</p><p><b>Le risque.</b> Prendre des décisions parce que « le graphique est joli ». Une belle courbe passée attire l'argent au pire moment : après la hausse.</p>",
exemple:"Une action passe de 10 € à 11 € sur un graphique dont l'axe démarre à 9,80 € : visuellement, une fusée (+500 % à l'écran !). Le même mouvement sur un axe partant de 0 : une ligne presque plate (+10 %). Même donnée, deux récits opposés. L'échelle est la première chose à vérifier.",
quiz:[
{q:"Que garantit une courbe qui monte depuis 6 mois ?",o:["Qu'elle va continuer","Rien du tout","Qu'il faut acheter vite"],b:1,e:"Le passé d'un cours ne contient pas son avenir. L'extrapolation est le piège visuel n° 1."},
{q:"Pourquoi faut-il regarder l'échelle d'un graphique ?",o:["Pour vérifier les couleurs","Un axe tronqué peut transformer +10 % en fusée visuelle","C'est inutile"],b:1,e:"Un axe qui ne part pas de zéro amplifie visuellement le moindre mouvement : outil favori des vendeurs de rêve."},
{q:"À quoi un graphique sert-il légitimement ?",o:["Prédire les cours de demain","Situer le présent et mesurer la volatilité passée","Détecter les figures « épaule-tête-épaule »"],b:1,e:"Contexte et amplitude passée : oui. Boule de cristal : non."}]},

{id:"l16",niveau:2,duree:8,badge:"🧾",badgeNom:"Analyste en herbe",titre:"Résultats d'entreprise et PER : combien « vaut » une action ?",
contenu:"<p><b>Le quoi.</b> Quatre fois par an, chaque entreprise cotée publie ses résultats (« earnings ») : chiffre d'affaires, bénéfices, prévisions. Et le marché compare toujours au niveau ATTENDU par les analystes — pas à l'année précédente.</p><p><b>Le pourquoi.</b> C'est le paradoxe qui déroute tous les débutants : une entreprise peut annoncer des bénéfices records et chuter de 8 % — parce que le marché attendait encore mieux, ou parce que les prévisions déçoivent. Les cours intègrent les attentes À L'AVANCE : quand la nouvelle paraît, elle est souvent « déjà dans les prix ».</p><p><b>Le comment.</b> L'outil de base pour relier prix et bénéfices : le PER (Price/Earnings Ratio) = cours ÷ bénéfice par action. Un PER de 15 signifie que tu paies 15 années de bénéfices actuels. Repères très approximatifs : 10-20 pour une entreprise mûre, 25-40+ pour une forte croissance (on paie l'avenir espéré). Un PER bas n'est pas forcément une affaire (parfois l'entreprise décline) ; un PER haut n'est pas forcément une bulle (parfois la croissance le justifie). Le PER sert à COMPARER — jamais à décider seul.</p><p><b>Le risque.</b> Acheter juste avant des résultats en espérant un bond : c'est un pile ou face, pas un investissement. Le débutant regarde les résultats pour comprendre, pas pour parier dessus.</p>",
exemple:"Une action cote 90 €, bénéfice par action de 6 € : PER = 15. Sa concurrente cote 45 € avec 1,50 € de bénéfice : PER = 30. La seconde est « moins chère » en euros mais deux fois plus chère en années de bénéfices — le prix affiché d'une action ne dit RIEN de sa cherté réelle.",
quiz:[
{q:"Une entreprise publie des bénéfices records et son action chute. Pourquoi ?",o:["Le marché s'est trompé de bouton","Le marché attendait encore mieux : les attentes étaient déjà dans le prix","Les records font toujours baisser"],b:1,e:"Le cours reflète les anticipations. Un record « moins bien qu'espéré » est une déception pour le marché."},
{q:"Que signifie un PER de 20 ?",o:["L'action vaut 20 €","Tu paies l'équivalent de 20 années de bénéfices actuels","L'action rapportera 20 % par an"],b:1,e:"PER = prix ÷ bénéfice par action : le nombre d'années de bénéfices contenues dans le prix."},
{q:"Une action à 8 € est-elle moins chère qu'une action à 800 € ?",o:["Oui, évidemment","On ne peut rien en conclure : seule la comparaison aux bénéfices compte","Non, elle est plus chère"],b:1,e:"Le prix unitaire dépend juste du nombre d'actions émises. La « cherté » se mesure en ratios, pas en euros."}]},

{id:"l17",niveau:2,duree:8,badge:"🧠",badgeNom:"Maître de soi",titre:"La psychologie de l'investisseur : ton pire ennemi est dans le miroir",
contenu:"<p><b>Le quoi.</b> Les études le montrent depuis 30 ans : l'investisseur particulier moyen gagne nettement MOINS que les fonds dans lesquels il investit. La cause n'est ni l'intelligence ni l'information — ce sont les émotions, qui font acheter haut (euphorie) et vendre bas (panique).</p><p><b>Le pourquoi.</b> Quatre biais font l'essentiel des dégâts. L'aversion à la perte : une perte fait deux fois plus mal qu'un gain ne fait plaisir → on garde ses perdants et on coupe ses gagnants. L'effet de troupeau : on achète ce dont tout le monde parle → au sommet. L'ancrage : on reste fixé sur son prix d'achat (« je vends quand ça reviendra à mon prix ») → le marché s'en moque. Le biais de confirmation : on ne lit que ce qui nous donne raison → l'opinion devient obstination.</p><p><b>Le comment.</b> On ne supprime pas ses biais — on les court-circuite par des règles décidées À FROID : le DCA automatique (achète pendant les paniques sans te demander ton avis), la thèse écrite avant chaque achat (avec son critère d'invalidation), le journal de bord (MENTOR l'automatise), et la règle des 24 h : jamais de décision le jour d'une émotion forte.</p><p><b>Le risque.</b> Croire qu'on est l'exception. Le biais le plus dangereux est l'excès de confiance — et il culmine précisément après les premiers succès, quand on confond marché haussier et talent personnel.</p>",
exemple:"Mars 2020 : le marché mondial perd 30 % en un mois. L'investisseur A panique et vend ; il « attend que ça se calme » et rachète un an plus tard… 40 % plus haut. L'investisseur B, DCA automatique, ne fait rien : ses versements de mars et avril, achetés au plus bas, deviennent ses meilleurs achats de la décennie. Écart de richesse : énorme. Écart de QI : nul.",
quiz:[
{q:"Pourquoi l'investisseur moyen gagne-t-il moins que les fonds qu'il détient ?",o:["Les fonds trichent","Il achète après les hausses et vend après les baisses","Les impôts mangent tout"],b:1,e:"Le « behavior gap » : les entrées/sorties dictées par l'émotion détruisent la performance."},
{q:"Que dit le biais d'ancrage ?",o:["On reste fixé sur son prix d'achat, pourtant sans importance pour le marché","On jette l'ancre au port","On copie les autres"],b:0,e:"« Je vendrai quand ça reviendra à mon prix » n'a aucun fondement : le marché ignore ton prix d'entrée."},
{q:"Quelle est la meilleure défense contre ses propres biais ?",o:["Plus de volonté","Des règles automatiques décidées à froid (DCA, thèse écrite, règle des 24 h)","Suivre les réseaux sociaux"],b:1,e:"On ne bat pas son cerveau par la volonté au moment chaud : on l'encadre par des règles posées avant."}]},

{id:"l18",niveau:2,duree:8,badge:"⚠️",badgeNom:"Détecteur de pièges",titre:"CFD et effet de levier : LE piège du débutant (surtout sur eToro)",
contenu:"<p><b>Le quoi.</b> Un CFD (« contrat sur la différence ») est un pari sur la variation d'un prix : tu ne possèdes AUCUNE action, juste un contrat contre la plateforme. L'effet de levier multiplie ta mise par 2, 5, 20 : les gains… et les pertes.</p><p><b>Le pourquoi c'est un piège.</b> Les chiffres sont publics et sans appel : les régulateurs imposent aux courtiers d'afficher que 74 à 89 % des comptes de particuliers PERDENT de l'argent sur les CFD. Avec un levier ×5, une baisse de 20 % — banale en bourse — efface 100 % de ta mise : tu peux avoir raison sur le fond et être ruiné quand même, éjecté par une secousse temporaire. S'ajoutent des frais de financement quotidiens qui rongent les positions. Et les plateformes les mettent en avant car c'est là qu'elles gagnent le plus.</p><p><b>Le comment (s'en protéger).</b> Sur eToro, vérifie CHAQUE ordre : le multiplicateur doit afficher ×1 et la mention « Vous achetez l'actif sous-jacent » doit apparaître. Levier ×2 ou plus, position « Vendre » (à découvert) : tu es en CFD, annule. MENTOR refusera toujours de t'accompagner vers ces produits — et t'expliquera pourquoi à chaque fois.</p><p><b>Le risque.</b> Il EST le produit. Retiens la règle en une phrase : si tu ne possèdes pas l'actif, tu ne fais pas de l'investissement — tu fais un pari contre un casino qui fixe lui-même les règles.</p>",
exemple:"Tu « investis » 1 000 € sur une action avec un levier ×5 : exposition de 5 000 €. L'action baisse de 12 % dans la semaine (banal), soit −600 € : 60 % de ta mise a disparu. À −20 %, tout est perdu et la position est fermée d'office. La même somme SANS levier : −120 €, position intacte, tout le temps de la voir se reprendre. Le levier ne change pas seulement l'ampleur : il te retire le droit d'attendre.",
quiz:[
{q:"Que possèdes-tu quand tu achètes un CFD sur l'action Apple ?",o:["Une action Apple","Rien : un simple contrat de pari avec la plateforme","Une option Apple"],b:1,e:"Aucun titre, aucun droit d'actionnaire : juste un contrat contre le courtier, avec frais quotidiens."},
{q:"Avec un levier ×5, quelle baisse suffit à effacer 100 % de ta mise ?",o:["50 %","20 %","5 %"],b:1,e:"−20 % × 5 = −100 %. Or des baisses de 20 %, la bourse en fait régulièrement. Le levier interdit d'attendre le rebond."},
{q:"Quelle proportion de particuliers perd de l'argent sur les CFD (chiffres réglementaires) ?",o:["Environ 10 %","Environ 50 %","74 à 89 %"],b:2,e:"C'est écrit, en petit, sur les sites des courtiers eux-mêmes — obligation légale européenne."}]},

{id:"l19",niveau:3,duree:8,badge:"🌪️",badgeNom:"Mémoire des tempêtes",titre:"Bulles et krachs : 400 ans d'histoires qui se répètent",
contenu:"<p><b>Le quoi.</b> Une bulle : les prix montent parce qu'ils montent, portés par la conviction que « cette fois c'est différent », jusqu'à la déconnexion totale d'avec la réalité. Puis l'éclatement : un krach. Tulipes (1637), bulle internet (2000, Nasdaq −78 %), subprimes (2008, marchés mondiaux −50 %), Covid (2020, −34 % en un mois… récupérés en 6 mois).</p><p><b>Le pourquoi.</b> Le scénario est immuable : une vraie innovation → un enthousiasme raisonnable → l'arrivée massive du grand public attiré par les gains des autres (FOMO) → des valorisations absurdes justifiées par des théories nouvelles → un déclencheur quelconque → la panique. Les acteurs changent, la pièce jamais — parce que la nature humaine ne change pas.</p><p><b>Le comment (survivre).</b> Trois leçons de l'Histoire : les krachs sont IMPRÉVISIBLES (personne ne les a jamais datés à l'avance de façon fiable) ; ils sont TEMPORAIRES pour un portefeuille mondial diversifié (le marché américain a effacé 1929, 2000, 2008…) — mais pas forcément pour une action isolée (beaucoup de stars de 2000 ont disparu) ; ils sont une OPPORTUNITÉ pour le DCA, qui achète mécaniquement au rabais. Signaux de prudence : quand tout le monde « investit », quand on justifie n'importe quel prix, quand on te dit « cette fois c'est différent ».</p><p><b>Le risque.</b> Il n'est pas d'être exposé à un krach — c'est inévitable et tu en vivras plusieurs. Il est d'y réagir : vendre en panique transforme une baisse temporaire en perte définitive.</p>",
exemple:"100 € investis dans le S&P 500 au PIRE moment de 2007, juste avant −50 % : encore ≈ 65 € début 2009… mais ≈ 400 € quinze ans plus tard, dividendes réinvestis. Le même parcours en vendant dans la panique de 2009 : ≈ 50 € définitivement perdus pour moitié. La différence entre les deux : rien d'autre que ne rien avoir fait.",
quiz:[
{q:"Quelle phrase signe historiquement l'approche du sommet d'une bulle ?",o:["« Les arbres ne montent pas au ciel »","« Cette fois, c'est différent »","« Prudence est mère de sûreté »"],b:1,e:"Chaque bulle invente sa théorie pour justifier des prix fous. C'est le signal d'alarme le plus fiable de l'Histoire."},
{q:"Peut-on prévoir la date d'un krach ?",o:["Oui, avec les bons graphiques","Non : personne n'y est parvenu de façon fiable et répétée","Oui, la banque centrale l'annonce"],b:1,e:"Des célébrités prédisent « le krach » chaque année. Une horloge arrêtée a raison deux fois par jour."},
{q:"Que fait le pratiquant du DCA pendant un krach ?",o:["Il suspend ses versements","Il continue exactement pareil : ses achats se font au rabais","Il passe sur CFD"],b:1,e:"Le krach est le moment où la mécanique du DCA travaille le plus fort pour toi. Encore faut-il ne pas la débrancher."}]},

{id:"l20",niveau:3,duree:7,badge:"🛡️",badgeNom:"Incorruptible",titre:"Les arnaques : reconnaître les pièges qui visent les débutants",
contenu:"<p><b>Le quoi.</b> Les escrocs adorent les débutants en investissement : motivés, peu méfiants, attirés par les promesses. Formes courantes : faux sites de trading (souvent avec de faux conseillers au téléphone), « signaux » et formations miracles sur les réseaux sociaux, arnaques sentimentales qui finissent en placement, pyramides de Ponzi, faux placements « garantis 10 % par mois », usurpation de vrais établissements.</p><p><b>Le pourquoi ça marche.</b> L'appât joue sur des ressorts réels : l'envie d'aller vite, la preuve sociale (faux témoignages, captures d'écran de gains), l'urgence (« offre limitée »), l'autorité (faux logos AMF, faux conseillers). Et le piège se referme en deux temps : on te laisse « gagner » au début et même retirer un peu — puis, quand tu verses gros, tout disparaît.</p><p><b>Le comment (se protéger).</b> Cinq réflexes : 1) Rendement élevé garanti = arnaque, sans exception (le rendement sans risque n'existe pas au-delà du livret). 2) Vérifier le site sur les listes noires de l'AMF (amf-france.org) et le registre REGAFI. 3) Jamais de virement vers un compte à l'étranger sous pression. 4) On ne te démarche jamais légalement par téléphone/WhatsApp pour un placement en actions. 5) Personne de sérieux ne demande un accès à distance à ton ordinateur ou tes identifiants bancaires. En cas de doute : ne rien signer, en parler, vérifier — l'urgence est TOUJOURS l'arme de l'escroc.</p><p><b>Le risque.</b> Contrairement à la bourse, ici la perte est totale, immédiate et sans recours ou presque. La prudence n'est pas de la paranoïa : c'est une compétence d'investisseur à part entière.</p>",
exemple:"« Plateforme » vue sur Instagram : +8 % par mois garantis, compte de démonstration bluffant, conseiller dédié très aimable. Tu verses 500 €, ton « compte » affiche vite 540 €, on te laisse même retirer 40 € (l'hameçon). Le conseiller t'appelle : « une opportunité exceptionnelle, il faut 5 000 € avant vendredi ». Après le virement : plateforme injoignable, argent parti à l'étranger, quasi irrécupérable. Schéma vécu par des milliers de Français chaque année.",
quiz:[
{q:"« 8 % par mois, capital garanti. » Que conclure ?",o:["Une opportunité rare","Une arnaque, sans exception possible","Un placement audacieux mais légal"],b:1,e:"8 %/mois ≈ +150 %/an garantis : aucun placement légal au monde n'offre ça. La certitude affichée EST la preuve de l'arnaque."},
{q:"Pourquoi les escrocs te laissent-ils retirer un petit gain au début ?",o:["Par honnêteté","Pour gagner ta confiance avant le gros versement","Par erreur"],b:1,e:"Le petit retrait autorisé est l'hameçon classique : il « prouve » que ça marche, juste avant le piège."},
{q:"Quel est le bon réflexe avant de verser sur une plateforme inconnue ?",o:["Vérifier les listes noires de l'AMF et le registre des établissements agréés","Regarder les avis sur la page de la plateforme","Tester avec une grosse somme"],b:0,e:"L'AMF publie et met à jour les listes noires. Les avis affichés par la plateforme elle-même ne valent rien."}]},

{id:"l21",niveau:3,duree:7,badge:"📰",badgeNom:"Décrypteur",titre:"L'actualité et les cours : pourquoi la nouvelle est « déjà dans les prix »",
contenu:"<p><b>Le quoi.</b> Le principe le plus contre-intuitif de la bourse : quand une information est publiée, des milliers de professionnels l'ont intégrée en quelques secondes. Le cours que tu vois contient déjà toutes les informations publiques ET les anticipations sur l'avenir.</p><p><b>Le pourquoi.</b> C'est pour ça qu'agir sur une nouvelle du journal du matin est illusoire : tu arrives des heures — parfois des semaines — après le marché, qui anticipe (la bourse baisse souvent AVANT la récession officielle, monte AVANT la reprise annoncée). D'où le paradoxe permanent : « bonne nouvelle, cours en baisse » signifie que le marché attendait mieux.</p><p><b>Le comment.</b> Alors, à quoi sert de suivre l'actualité ? À COMPRENDRE, pas à réagir. C'est l'objet du briefing quotidien MENTOR : reconstituer les chaînes causales (événement → mécanisme → actifs concernés) pour éduquer ton intuition économique. Avec le temps, tu sauras relier une décision de banque centrale, un prix de l'énergie, une tension géopolitique à leurs effets sur les entreprises. Cette culture te rendra serein — plus rien ne semblera arbitraire — sans jamais te donner de boule de cristal.</p><p><b>Le risque.</b> Confondre comprendre et prédire. Le briefing t'apprend à lire le film en cours, pas à connaître la fin. Celui qui « trade les nouvelles » depuis son téléphone affronte des algorithmes qui réagissent en microsecondes : la course est perdue d'avance.</p>",
exemple:"Lundi 8 h : la presse annonce d'excellents chiffres pour une entreprise, tu veux acheter à l'ouverture. Mais les professionnels anticipaient ces chiffres depuis des semaines : le cours avait déjà monté de 12 % le mois précédent. À l'ouverture, il ne bouge pas… puis baisse de 2 % : les chiffres, excellents, étaient légèrement sous les attentes les plus optimistes. Tu viens de vivre « acheter la rumeur, vendre la nouvelle » — dans le mauvais sens.",
quiz:[
{q:"Une nouvelle publiée dans la presse ce matin est…",o:["Une occasion d'achat rapide","Déjà intégrée dans les cours depuis des heures ou des semaines","Secrète"],b:1,e:"Les marchés réagissent en secondes et anticipent en semaines. Le journal du matin arrive toujours après la bataille."},
{q:"La bourse baisse alors que l'économie va encore bien. Interprétation classique ?",o:["Le marché anticipe une dégradation à venir","Les ordinateurs ont bugué","C'est impossible"],b:0,e:"Le marché vit dans le futur : il price les 6-12 prochains mois, pas le présent."},
{q:"À quoi sert le briefing quotidien MENTOR ?",o:["À donner des signaux d'achat à exécuter vite","À éduquer ton intuition économique par les chaînes causales","À prédire les cours de demain"],b:1,e:"Comprendre les mécanismes rend serein et compétent. Prédire est impossible — et le briefing ne le prétend jamais."}]},

{id:"l22",niveau:3,duree:8,badge:"📝",badgeNom:"Stratège",titre:"Construire sa thèse d'investissement : penser avant d'agir",
contenu:"<p><b>Le quoi.</b> Une thèse d'investissement, c'est le POURQUOI écrit avant l'achat : quelle est mon idée, qu'est-ce qui la confirmerait, qu'est-ce qui l'invaliderait, quel est mon horizon, qu'est-ce que je risque. Cinq lignes suffisent — mais écrites AVANT.</p><p><b>Le pourquoi.</b> Sans thèse écrite, impossible d'apprendre : si ça monte tu te croiras génial, si ça baisse tu accuseras la malchance, et dans les deux cas tu n'auras rien appris. La thèse écrite transforme chaque décision en expérience scientifique : une hypothèse, des critères, un verdict. Elle protège aussi de l'obstination — quand le critère d'invalidation est atteint, la décision de sortir a DÉJÀ été prise, à froid.</p><p><b>Le comment.</b> Le format MENTOR en 5 points : 1) L'idée en une phrase (« cette entreprise va profiter de X parce que Y »). 2) Ce qui confirmerait (résultats, parts de marché, signaux concrets). 3) Ce qui invaliderait (le plus important ! ex. « si la marge passe sous 10 % » ou « si la thèse repose sur un contrat qui ne vient pas »). 4) Horizon (à quelle échéance je juge). 5) Risque accepté (combien je peux perdre sans dommage). Le Journal MENTOR stocke tout et le post-mortem hebdomadaire confronte tes thèses à la réalité.</p><p><b>Le risque.</b> La thèse fantôme, réécrite après coup (« en fait je le savais »). C'est humain et ça détruit l'apprentissage — d'où l'horodatage automatique du journal : on ne triche pas avec soi-même quand c'est écrit.</p>",
exemple:"Thèse (mars) : « J'achète l'ETF secteur santé européen : population vieillissante, valorisations raisonnables après la baisse. Confirme : résultats du secteur en hausse sur 12 mois. Invalide : réforme des prix du médicament en Europe ou PER du secteur au-dessus de 25. Horizon : 3 ans. Risque : je peux perdre 30 % temporairement sans devoir vendre. » — En septembre, tout relire face aux faits : c'est là que tu apprends réellement.",
quiz:[
{q:"Quand doit-on écrire sa thèse d'investissement ?",o:["Après l'achat, pour se souvenir","AVANT l'achat, pour pouvoir en tirer des leçons","Uniquement si on perd"],b:1,e:"Écrite avant, la thèse devient une hypothèse testable. Après, c'est de la littérature."},
{q:"Quel est l'élément le PLUS important d'une thèse ?",o:["L'objectif de gain","Le critère d'invalidation : ce qui prouverait que j'ai tort","Le nom du PDG"],b:1,e:"Savoir à l'avance ce qui te fera dire « je me suis trompé » protège de l'obstination — le tueur silencieux des portefeuilles."},
{q:"Ton action monte de 20 % pour une raison SANS rapport avec ta thèse. Verdict ?",o:["Ma thèse était bonne","J'ai eu de la chance : la thèse n'est ni confirmée ni digne de mérite","Je double la mise"],b:1,e:"Gagner pour de mauvaises raisons est dangereux : ça récompense un raisonnement faux. Le post-mortem sert exactement à distinguer chance et justesse."}]},

{id:"l23",niveau:3,duree:6,badge:"⚖️",badgeNom:"Équilibriste",titre:"Le rebalancement : entretenir son portefeuille sans le triturer",
contenu:"<p><b>Le quoi.</b> Avec le temps, les proportions de ton portefeuille dérivent : ce qui a monté pèse plus lourd, ce qui a baissé moins. Rebalancer = revenir périodiquement aux proportions cibles de ton plan, en allégeant ce qui a gonflé ou en renforçant ce qui a maigri (souvent simplement en dirigeant tes prochains versements DCA).</p><p><b>Le pourquoi.</b> Deux vertus : le contrôle du risque (sans rebalancement, un portefeuille 60 % actions peut devenir 80 % actions après quelques bonnes années — juste avant la correction) et la discipline anti-émotions : rebalancer force mécaniquement à vendre un peu ce qui a beaucoup monté et acheter ce qui est délaissé — l'inverse exact de l'instinct, et statistiquement vertueux.</p><p><b>Le comment.</b> Pour un débutant : une fois par an (à date fixe, ex. ton anniversaire) ou quand une classe d'actifs dévie de plus de 10 points de sa cible. Méthode douce et fiscalement maligne : rebalancer par les VERSEMENTS (diriger le DCA vers ce qui est sous-pondéré) plutôt qu'en vendant — zéro frais, zéro impôt déclenché. MENTOR surveille tes proportions et te signale les dérives.</p><p><b>Le risque.</b> Le sur-rebalancement : y toucher chaque semaine génère frais, impôts et stress pour un bénéfice nul. Le portefeuille est un jardin : on le taille une fois par an, on ne déterre pas les plantes chaque matin pour vérifier les racines.</p>",
exemple:"Cible : 70 % ETF World / 30 % obligations. Après une année haussière : 78 % / 22 %. Plutôt que vendre (impôts !), tu diriges tes 6 prochains versements DCA vers la poche obligataire jusqu'au retour à 70/30. Coût de l'opération : zéro. Discipline : maximale.",
quiz:[
{q:"Pourquoi les proportions d'un portefeuille dérivent-elles ?",o:["À cause des frais","Parce que les actifs évoluent différemment : ce qui monte pèse plus lourd","À cause de l'inflation"],b:1,e:"La dérive est mécanique. Sans entretien, ton profil de risque change sans que tu l'aies décidé."},
{q:"Quelle est la méthode de rebalancement la plus efficace fiscalement ?",o:["Tout vendre et racheter","Diriger ses nouveaux versements vers ce qui est sous-pondéré","Ne jamais rebalancer"],b:1,e:"Rebalancer par les flux entrants ne déclenche ni frais ni imposition : idéal en phase d'épargne."},
{q:"À quelle fréquence un débutant devrait-il rebalancer ?",o:["Chaque semaine","Environ une fois par an, ou sur dérive de plus de 10 points","Jamais avant 20 ans"],b:1,e:"Rare mais régulier. Plus fréquent = plus de frais et d'émotions pour aucun gain démontré."}]},

{id:"l24",niveau:3,duree:7,badge:"🧾",badgeNom:"En règle",titre:"Déclarer ses gains : les bases fiscales sans migraine",
contenu:"<p><b>Le quoi.</b> Les impôts ne se déclenchent qu'aux événements : VENDRE avec gain (plus-value) ou RECEVOIR un dividende. Tant que tu ne vends pas, tes plus-values latentes ne sont pas imposées — c'est l'énorme avantage du long terme.</p><p><b>Le pourquoi.</b> Comprendre la mécanique évite deux erreurs : la peur infondée (« je vais être taxé si ça monte » — non, pas tant que tu ne vends pas) et l'oubli coûteux (compte à l'étranger non déclaré : amende de 1 500 € par compte et par an).</p><p><b>Le comment.</b> Sur CTO français (Boursorama) : la banque calcule tout et envoie l'IFU (imprimé fiscal unique) ; les montants arrivent souvent PRÉ-REMPLIS dans ta déclaration — tu vérifies, cases 3VG (plus-values) et 2DC (dividendes). Le PFU de 30 % s'applique par défaut ; option possible pour le barème progressif si tu es peu imposé (à comparer). Les moins-values se déduisent des plus-values (reportables 10 ans). Sur PEA : RIEN à déclarer tant que tu ne retires pas. Sur eToro (courtier étranger) : déclarer l'existence du compte chaque année (formulaire 3916-bis) ET calculer toi-même tes plus-values (eToro fournit un rapport fiscal annuel pour t'aider).</p><p><b>Le risque.</b> L'oubli du 3916-bis pour eToro — l'erreur classique du débutant français, chère et facile à éviter. Au moindre doute sur une situation complexe (grosse cession, succession…) : un professionnel. MENTOR enseigne les bases, il ne remplace pas un expert-comptable.</p>",
exemple:"Année type : tu as vendu sur ton CTO avec 800 € de plus-values et reçu 120 € de dividendes. Impôt : (800 + 120) × 30 % = 276 €, largement pré-rempli par Boursorama. Ton PEA, lui, a gagné 1 500 € : impôt = 0, rien à déclarer (aucun retrait). Ton compte eToro dort sans un seul trade : il faut QUAND MÊME déclarer son existence (3916-bis).",
quiz:[
{q:"Quand une plus-value devient-elle imposable ?",o:["Dès que l'action monte","Quand tu vends et réalises le gain","Chaque 1er janvier"],b:1,e:"Pas de vente, pas d'impôt. C'est l'avantage fiscal majeur de l'investisseur de long terme qui ne vend pas."},
{q:"Que doit absolument déclarer un Français ayant un compte eToro ?",o:["Rien, eToro s'en occupe","L'existence du compte à l'étranger (formulaire 3916-bis), chaque année","Seulement les gains supérieurs à 10 000 €"],b:1,e:"Compte ouvert à l'étranger = déclaration annuelle obligatoire, même sans le moindre trade. Amende sinon : 1 500 €/compte/an."},
{q:"Combien déclarer pour un PEA sans retrait cette année ?",o:["Toutes les ventes faites dedans","Rien : le PEA est une bulle fiscale tant qu'on ne retire pas","Les dividendes uniquement"],b:1,e:"À l'intérieur du PEA, ventes et dividendes ne déclenchent rien. La fiscalité n'arrive qu'au retrait."}]},

{id:"l25",niveau:3,duree:8,badge:"🏛️",badgeNom:"Œil macro",titre:"Banques centrales et taux : le chef d'orchestre invisible",
contenu:"<p><b>Le quoi.</b> Les banques centrales (BCE pour l'euro, Fed pour le dollar) fixent les taux d'intérêt directeurs : le « prix de l'argent ». Leur mission : maintenir l'inflation autour de 2 %. Leurs décisions font bouger TOUS les marchés à la fois — c'est le sujet macro n° 1 de tes briefings.</p><p><b>Le pourquoi.</b> La chaîne causale fondamentale, à connaître par cœur : inflation trop forte → la banque centrale MONTE ses taux → crédit plus cher → ménages et entreprises dépensent moins → l'économie ralentit → l'inflation reflue. Effet bourse : les taux hauts pèsent sur les actions (bénéfices futurs moins « précieux » face à des placements sûrs devenus rémunérateurs, croissance freinée) — les valeurs de croissance souffrent le plus. À l'inverse, une BAISSE des taux est généralement un vent porteur pour les actions.</p><p><b>Le comment (lire les annonces).</b> Huit fois par an environ, chaque banque centrale annonce sa décision. Subtilité essentielle : le marché réagit à l'ÉCART entre la décision et ce qu'il anticipait — une hausse de taux attendue ne fait rien bouger, un simple discours plus dur que prévu peut faire chuter les indices. Retiens le vocabulaire des briefings : « hawkish » (faucon = dur contre l'inflation, taux hauts) et « dovish » (colombe = accommodant, taux bas).</p><p><b>Le risque.</b> Parier sur les décisions de banques centrales : même les professionnels s'y brûlent. Pour toi, ces annonces sont un cours d'économie en direct — pas un signal de trading.</p>",
exemple:"Chaîne causale type d'un briefing : « L'inflation américaine ressort à 3,4 % au lieu des 3,1 % attendus → le marché repousse ses espoirs de baisse de taux de la Fed → les taux d'emprunt restent hauts plus longtemps → pression sur les valeurs technologiques (bénéfices lointains) et le Nasdaq recule de 1,8 %, pendant que le dollar monte. » Un seul chiffre, quatre dominos.",
quiz:[
{q:"Pourquoi une banque centrale monte-t-elle ses taux ?",o:["Pour enrichir les banques","Pour freiner une inflation trop forte","Pour faire monter la bourse"],b:1,e:"Des taux plus hauts refroidissent le crédit et la demande, ce qui calme la hausse des prix."},
{q:"En général, des taux qui montent sont-ils bons pour les actions ?",o:["Oui, toujours","Plutôt défavorables, surtout pour les valeurs de croissance","Sans aucun effet"],b:1,e:"Placements sûrs plus rémunérateurs + crédit cher + bénéfices futurs dévalorisés = vent de face pour les actions."},
{q:"Le marché réagit surtout à…",o:["La décision elle-même","L'écart entre la décision et ce qui était anticipé","La couleur de la cravate du président de la Fed"],b:1,e:"Tout ce qui est anticipé est déjà dans les prix. Seule la SURPRISE fait bouger les cours."}]},

{id:"l26",niveau:3,duree:9,badge:"🎓",badgeNom:"Diplômé MENTOR",titre:"Ton plan d'investisseur : tout assembler",
contenu:"<p><b>Le quoi.</b> La leçon de synthèse : transformer 25 leçons en UN plan personnel écrit, simple, tenable des années. Un bon plan tient sur une page ; c'est sa simplicité qui le rend robuste.</p><p><b>Le pourquoi.</b> Sans plan écrit, chaque secousse du marché rouvre toutes les questions (« faut-il vendre ? renforcer ? attendre ? ») et les émotions décident. Avec un plan, la question devient : « que dit mon plan ? » — et il a réponse à tout, parce qu'il a été écrit à froid.</p><p><b>Le comment — les 7 lignes du plan MENTOR :</b> 1) Mon épargne de précaution : X mois de dépenses sur livret, intouchable. 2) Mon horizon : je n'investis que l'argent dont je n'ai pas besoin avant Y ans. 3) Mon allocation cible : Z % actions (ETF diversifiés) / le reste en sécurisé — selon mon profil. 4) Mon rythme : DCA de N € chaque mois, le même jour, sans exception. 5) Mes enveloppes : PEA d'abord (avantage fiscal), CTO pour le reste. 6) Mes règles de conduite : thèse écrite avant tout achat d'action individuelle, jamais plus de 20 % sur une ligne, jamais de levier ni de CFD, règle des 24 h en cas d'émotion forte. 7) Mon entretien : rebalancement annuel, post-mortem hebdomadaire avec MENTOR, bilan mensuel.</p><p><b>Le risque.</b> L'abandon du plan au premier orage — ou son inverse : la rigidité totale. Le plan se révise UNE fois par an ou lors d'un vrai changement de vie (mariage, enfant, achat immobilier…) — jamais en réaction au marché. Bravo : tu as désormais toutes les fondations. La suite s'apprend en pratiquant, briefing après briefing.</p>",
exemple:"Plan de Sarah, 28 ans : « 1) 4 000 € de précaution sur Livret A. 2) Horizon 15 ans+. 3) Cible 80 % ETF World / 20 % fonds euros. 4) DCA 150 € le 5 du mois. 5) PEA Boursorama en priorité. 6) Pas d'action individuelle au-delà de 10 % du total, thèse écrite obligatoire, zéro levier. 7) Rebalancement chaque 1er juillet, bilan mensuel MENTOR. » — 7 lignes qui répondent d'avance à 95 % des questions qu'elle se posera dans les 10 prochaines années.",
quiz:[
{q:"Quelle est la qualité principale d'un bon plan d'investissement ?",o:["Sa sophistication","Sa simplicité, qui le rend tenable pendant des années","Son rendement garanti"],b:1,e:"Un plan complexe s'abandonne à la première tempête. Un plan simple se tient — et c'est la tenue qui paie."},
{q:"Quand réviser son plan ?",o:["À chaque baisse des marchés","Une fois par an ou lors d'un vrai changement de vie","Jamais"],b:1,e:"On révise en fonction de SA vie, pas des humeurs du marché. C'est toute la différence entre piloter et subir."},
{q:"Que faire quand le marché panique et que tu es tenté d'agir ?",o:["Suivre son instinct","Relire son plan : il a déjà la réponse, écrite à froid","Consulter les réseaux sociaux"],b:1,e:"Le plan est ton toi-même rationnel qui parle à ton toi-même paniqué. C'est exactement pour ce moment qu'il existe."}]}
);

{id:"l27",niveau:4,duree:8,badge:"🏗️",badgeNom:"Lecteur de bilan",titre:"Le bilan : la photo du patrimoine d'une entreprise",
contenu:"<p><b>Le quoi.</b> Le bilan est la photographie, à une date donnée, de ce qu'une entreprise <b>possède</b> (l'actif : usines, stocks, trésorerie, brevets…) et de la façon dont c'est <b>financé</b> (le passif : capitaux apportés par les actionnaires + dettes). Les deux colonnes sont toujours égales — d'où le mot « bilan ».</p><p><b>Le pourquoi.</b> C'est le premier réflexe de l'analyste : avant de rêver aux profits futurs, on vérifie la solidité. Une entreprise très endettée est fragile : à la moindre tempête (récession, taux qui montent), les intérêts l'étouffent. Une entreprise riche en trésorerie peut traverser les crises, racheter des concurrents affaiblis, investir quand les autres coupent.</p><p><b>Le comment.</b> Trois regards simples : 1) La <b>trésorerie nette</b> : cash moins dettes financières — positif, c'est un matelas ; très négatif, c'est une épée au-dessus de la tête. 2) Les <b>capitaux propres</b> : ce qui appartient vraiment aux actionnaires ; s'ils fondent d'année en année, danger. 3) Le rapport <b>dette / capitaux propres</b> : au-delà de 100 %, l'entreprise appartient plus à ses banquiers qu'à ses actionnaires (sauf secteurs particuliers comme les services aux collectivités, structurellement endettés).</p><p><b>Le risque.</b> Comparer des bilans de secteurs différents n'a aucun sens : une banque, une biotech et un industriel ont des structures incomparables. On compare une entreprise à ses concurrentes directes et à son propre passé.</p>",
exemple:"Entreprise A : 2 Md€ de trésorerie, 0,5 Md€ de dettes, capitaux propres en hausse depuis 10 ans → forteresse. Entreprise B : 0,2 Md€ de cash, 4 Md€ de dettes, capitaux propres divisés par deux en 5 ans → château de cartes. Les deux peuvent avoir le même bénéfice cette année : le bilan révèle celle qui survivra à la prochaine crise.",
quiz:[
{q:"Que montre le bilan d'une entreprise ?",o:["Ses ventes de l'année","La photo de ce qu'elle possède et de ses financements à une date donnée","Le cours de son action"],b:1,e:"Le bilan est une photographie du patrimoine : actif d'un côté, financements (capitaux propres + dettes) de l'autre."},
{q:"Une dette financière bien supérieure aux capitaux propres signale…",o:["Une entreprise ambitieuse, c'est bon signe","Une fragilité : les banquiers pèsent plus que les actionnaires","Rien de particulier"],b:1,e:"Sauf secteurs spécifiques, un levier d'endettement élevé rend l'entreprise vulnérable aux tempêtes et aux hausses de taux."},
{q:"Avec qui comparer le bilan d'une entreprise ?",o:["N'importe quelle entreprise cotée","Ses concurrentes directes et son propre historique","Les banques uniquement"],b:1,e:"Chaque secteur a sa structure normale : une comparaison n'a de sens qu'à secteur comparable."}]},

{id:"l28",niveau:4,duree:8,badge:"🎬",badgeNom:"Lecteur de résultat",titre:"Le compte de résultat : le film de l'année",
contenu:"<p><b>Le quoi.</b> Si le bilan est une photo, le compte de résultat est le <b>film de l'année</b> : en haut, le chiffre d'affaires (tout ce qui a été vendu) ; on descend en retirant les coûts étage par étage ; en bas, le bénéfice net. Entre les deux, les <b>marges</b> — les vrais indices de qualité.</p><p><b>Le pourquoi.</b> Deux entreprises qui vendent 1 milliard ne se valent pas : celle qui en garde 250 millions (marge nette 25 %) possède probablement un avantage durable — marque, brevet, position dominante ; celle qui en garde 20 millions (2 %) se bat sur les prix et vacille au premier choc. La marge, c'est le « pouvoir » d'une entreprise rendu visible.</p><p><b>Le comment.</b> Regarde trois choses, toujours sur <b>plusieurs années</b> : 1) Le chiffre d'affaires croît-il régulièrement (croissance réelle) ou par à-coups (cycles, acquisitions) ? 2) La <b>marge opérationnelle</b> (bénéfice d'exploitation ÷ ventes) est-elle stable ou en hausse ? Une marge qui s'érode année après année raconte une entreprise qui perd son avantage. 3) Le bénéfice net contient-il des éléments « exceptionnels » (vente d'une filiale, dépréciation) qui faussent la lecture ? Repères très grossiers : marge nette > 15 % = très belle affaire ; 5-15 % = correcte ; < 5 % = métier difficile.</p><p><b>Le risque.</b> Le bénéfice d'UNE seule année ne dit presque rien : il se maquille légalement de mille façons (provisions, calendrier des charges…). C'est la tendance sur 5 à 10 ans qui parle — et la leçon suivante montrera un chiffre encore plus difficile à maquiller.</p>",
exemple:"LuxeCo vend 1 Md€ de sacs, marge nette 22 % → 220 M€ de bénéfice ; elle peut augmenter ses prix de 5 % sans perdre un client. DiscountCo vend 1 Md€ d'alimentaire, marge nette 2 % → 20 M€ ; une hausse de 2 % du coût de l'énergie efface la moitié de son bénéfice. Même taille apparente, deux mondes.",
quiz:[
{q:"Que mesure la marge nette ?",o:["La part des ventes qui devient du bénéfice","La croissance des ventes","Le niveau de la dette"],b:0,e:"Marge nette = bénéfice net ÷ chiffre d'affaires : combien chaque euro vendu laisse dans la caisse."},
{q:"Une marge opérationnelle qui s'érode 4 années de suite raconte…",o:["Une entreprise qui perd progressivement son avantage concurrentiel","Une gestion prudente","Une future hausse du dividende"],b:0,e:"L'érosion durable des marges est l'un des signaux fondamentaux les plus sérieux : concurrence, coûts, perte de pouvoir de prix."},
{q:"Pourquoi le bénéfice d'une seule année est-il peu fiable ?",o:["Les comptables se trompent souvent","Des éléments exceptionnels et des choix comptables peuvent le déformer","Il est secret"],b:1,e:"Cessions, provisions, dépréciations… Le bénéfice annuel se maquille légalement. La tendance longue, beaucoup moins."}]},

{id:"l29",niveau:4,duree:8,badge:"💧",badgeNom:"Traqueur de cash",titre:"Les flux de trésorerie : l'argent qui ne ment pas",
contenu:"<p><b>Le quoi.</b> Le tableau des flux de trésorerie suit le <b>cash réel</b> qui entre et sort : ce que l'activité génère, ce que l'entreprise investit, ce qu'elle emprunte ou rembourse. Sa star : le <b>free cash flow</b> (flux de trésorerie disponible) = cash généré par l'activité − investissements nécessaires. C'est l'argent vraiment libre, pour les dividendes, les rachats d'actions ou le désendettement.</p><p><b>Le pourquoi.</b> Le bénéfice est une opinion (comptable), le cash est un fait. Une entreprise peut afficher des bénéfices en trompe-l'œil pendant des années alors que sa caisse se vide — c'est le point commun de la plupart des grands scandales (Enron, Wirecard). À l'inverse, une entreprise au bénéfice modeste mais au cash-flow puissant est souvent une pépite discrète.</p><p><b>Le comment.</b> Deux vérifications d'or : 1) Le <b>cash suit-il le bénéfice</b> ? Sur 5 ans, le cash généré par l'activité doit être du même ordre que les bénéfices cumulés. S'il est très inférieur, quelque chose cloche (clients qui ne paient pas, stocks qui gonflent, comptabilité créative). 2) Le <b>free cash flow est-il positif et régulier</b> ? Une entreprise qui doit emprunter chaque année pour survivre n'est pas un investissement, c'est un pari.</p><p><b>Le risque.</b> Certaines entreprises jeunes brûlent légitimement du cash pour croître (on finance l'avenir). La question devient alors : combien de trimestres de survie reste-t-il en caisse, et le chemin vers la rentabilité est-il crédible ? Sans réponse claire, un débutant passe son chemin.</p>",
exemple:"Sur 5 ans, PapierSA affiche 500 M€ de bénéfices cumulés… mais seulement 90 M€ de cash généré : ses « ventes » dorment en factures impayées et en stocks. CashCo affiche 400 M€ de bénéfices et 430 M€ de cash : chaque euro de profit existe vraiment. Deux ans plus tard, PapierSA lance un avertissement sur résultats ; CashCo augmente son dividende. Le cash avait prévenu.",
quiz:[
{q:"Pourquoi dit-on que « le bénéfice est une opinion, le cash un fait » ?",o:["Parce que les bénéfices sont toujours faux","Parce que la comptabilité laisse des marges d'interprétation, alors que la caisse ne ment pas","Parce que le cash est imposé"],b:1,e:"Provisions, amortissements, reconnaissance du chiffre d'affaires : le bénéfice se module. Les mouvements de trésorerie, très difficilement."},
{q:"Qu'est-ce que le free cash flow ?",o:["Le cash de l'activité moins les investissements nécessaires","Le bénéfice net","La trésorerie totale en caisse"],b:0,e:"C'est l'argent vraiment disponible après avoir entretenu et développé l'outil de production — le carburant des dividendes."},
{q:"Sur 5 ans, une entreprise cumule 500 M€ de bénéfices mais génère 90 M€ de cash. Réaction ?",o:["Superbe rentabilité","Signal d'alarme : les profits ne se transforment pas en argent réel","C'est parfaitement normal partout"],b:1,e:"Un écart durable bénéfice/cash est le drapeau rouge classique des comptabilités trop créatives — vérifié dans presque tous les grands scandales."}]},

{id:"l30",niveau:4,duree:8,badge:"📐",badgeNom:"Maître des ratios",titre:"Les ratios de l'analyste : ROE, dette, et la boîte à outils",
contenu:"<p><b>Le quoi.</b> Les ratios compriment les comptes en quelques chiffres comparables. Après le PER (leçon 16), voici la boîte à outils de base : le <b>ROE</b> (return on equity : bénéfice ÷ capitaux propres) — combien rapporte chaque euro confié par les actionnaires ; la <b>dette nette / EBITDA</b> — combien d'années de résultat brut il faudrait pour rembourser la dette ; la <b>marge nette</b> (leçon 28) ; et le <b>rendement du free cash flow</b> (FCF ÷ capitalisation) — le « loyer réel » que produit l'entreprise.</p><p><b>Le pourquoi.</b> Isolé, un chiffre n'est rien ; en ratio, il devient comparable entre entreprises de tailles différentes, et surtout traçable dans le temps. Un ROE durablement au-dessus de 15 % signe presque toujours un avantage concurrentiel réel ; une dette nette supérieure à 3× l'EBITDA met l'entreprise à la merci de ses créanciers.</p><p><b>Le comment.</b> La méthode : jamais un ratio seul, toujours un <b>tableau de bord</b> (ROE + marge + dette + FCF) ; jamais une année seule, toujours <b>5 à 10 ans</b> ; jamais dans l'absolu, toujours <b>face aux concurrents directs</b>. Piège classique : un ROE gonflé artificiellement par l'endettement (peu de capitaux propres → ratio flatteur) — d'où l'importance de croiser avec la dette.</p><p><b>Le risque.</b> La « ratio-manie » : empiler 30 indicateurs et perdre le fil. Quatre ratios bien compris, suivis sur dix ans, battent trente ratios survolés. Et aucun ratio ne dit si le PRIX de l'action est raisonnable — c'est l'objet de la prochaine leçon.</p>",
exemple:"SolideCo : ROE 18 %, stable depuis 8 ans, dette nette/EBITDA 0,8, marge nette 16 % → machine de qualité. MirageCo : ROE 25 % (waouh !)… mais dette/EBITDA 4,5 : le ROE est dopé au levier — les capitaux propres sont squelettiques. En 2022, quand les taux montent, MirageCo divise son dividende ; SolideCo ne bronche pas.",
quiz:[
{q:"Que mesure le ROE ?",o:["Le rendement du dividende","Ce que rapporte chaque euro de capitaux propres confié par les actionnaires","La croissance des ventes"],b:1,e:"ROE = bénéfice ÷ capitaux propres. Durablement > 15 %, c'est souvent la signature d'un avantage concurrentiel."},
{q:"Une dette nette de 4,5 fois l'EBITDA signifie…",o:["Une situation confortable","Qu'il faudrait 4,5 années de résultat brut pour rembourser : c'est lourd","Que l'entreprise n'a pas de dette"],b:1,e:"Au-delà de ~3×, l'entreprise devient l'otage de ses créanciers et des taux d'intérêt."},
{q:"Un ROE spectaculaire peut être artificiellement gonflé par…",o:["L'endettement, qui réduit les capitaux propres au dénominateur","Les dividendes","La publicité"],b:0,e:"Beaucoup de dette + peu de capitaux propres = ROE flatteur mais fragile. On croise TOUJOURS le ROE avec l'endettement."}]},

{id:"l31",niveau:4,duree:9,badge:"⚖️",badgeNom:"Estimateur",titre:"La valorisation : combien vaut vraiment cette entreprise ?",
contenu:"<p><b>Le quoi.</b> Valoriser, c'est estimer ce que vaut une entreprise pour la comparer à son prix en bourse. L'idée profonde, formulée par Warren Buffett d'après son maître Graham : <b>le prix est ce que tu paies, la valeur est ce que tu obtiens</b> — et les deux divergent régulièrement.</p><p><b>Le pourquoi.</b> Une magnifique entreprise achetée trop cher est un mauvais placement (les acheteurs de superbes valeurs technologiques en 2000 ont attendu 15 ans pour s'en remettre). Une entreprise moyenne achetée très en dessous de sa valeur peut être excellente. Sans notion de valorisation, on n'investit pas : on espère.</p><p><b>Le comment.</b> Trois approches, de la plus simple à la plus fine : 1) <b>Les multiples historiques</b> : comparer le PER actuel de l'entreprise à sa propre moyenne sur 10 ans — coté à 30× quand sa norme est 18×, il faudra que tout aille parfaitement. 2) <b>Le rendement du free cash flow</b> : FCF ÷ capitalisation ; à 6-8 %, tu es payé correctement pour attendre ; à 2 %, tu paies très cher l'espoir de croissance. 3) <b>L'actualisation simplifiée (DCF)</b> : la valeur = la somme des cash-flows futurs « ramenés à aujourd'hui » (un euro dans 10 ans vaut moins qu'un euro maintenant). Inutile d'en faire le calcul complet : retiens sa LEÇON — plus les taux d'intérêt montent, plus les profits lointains perdent de valeur ; c'est le lien mécanique entre banques centrales et bourse (leçon 25).</p><p><b>Le risque.</b> La fausse précision. Un DCF donne « 87,32 € » avec trois décimales… bâties sur des hypothèses à ±30 %. La valorisation donne un ORDRE DE GRANDEUR et une marge de sécurité, jamais une cible exacte. Méfie-toi de quiconque affiche des objectifs de cours au centime.</p>",
exemple:"GrandeMarque génère 5 € de FCF par action et cote 70 € → rendement FCF ≈ 7 % : tu es bien payé. Sa jumelle StarTech génère 2 € et cote 200 € → 1 % : tu paies 100 ans de cash-flow actuel, en pariant que tout triplera. Parfois le pari réussit — mais appelle-le par son nom : un pari, pas un placement de bon père de famille.",
quiz:[
{q:"« Le prix est ce que tu paies, la valeur est ce que tu obtiens » signifie…",o:["Prix et valeur sont toujours égaux","Le cours de bourse peut s'éloigner durablement de la valeur réelle","La valeur n'existe pas"],b:1,e:"C'est tout l'espace de l'investisseur : acheter quand le prix est nettement sous la valeur estimée."},
{q:"Un rendement du free cash flow de 7 % veut dire…",o:["L'action montera de 7 % par an","L'entreprise génère chaque année 7 % de sa capitalisation en cash disponible","Le dividende est de 7 %"],b:1,e:"C'est le « loyer économique » réel de l'entreprise — comparable à un rendement locatif, sans promesse sur le cours."},
{q:"Quelle est la grande leçon du DCF pour comprendre les marchés ?",o:["Il donne le prix exact d'une action","Quand les taux montent, les profits lointains valent moins aujourd'hui — les valeurs de croissance souffrent","Il ne sert à rien"],b:1,e:"L'actualisation relie mécaniquement taux d'intérêt et valorisations : le grand rouage macro→bourse."}]},

{id:"l32",niveau:4,duree:8,badge:"📖",badgeNom:"Rat de rapport annuel",titre:"Lire un rapport annuel en 30 minutes (sans se noyer)",
contenu:"<p><b>Le quoi.</b> Chaque société cotée publie un rapport annuel (en France : le « document d'enregistrement universel », souvent 300+ pages). Personne — pas même les professionnels — ne lit tout : l'art est de savoir <b>où aller</b>.</p><p><b>Le pourquoi.</b> C'est LA source primaire : tout le reste (articles, forums, vidéos) est du commentaire de seconde main, souvent orienté. Trente minutes dans le document officiel t'apprennent plus que dix heures de réseaux sociaux — et surtout, tu y trouves ce que les vendeurs d'histoires omettent : les risques, écrits noir sur blanc.</p><p><b>Le comment — le parcours en 5 arrêts (30 min chrono) :</b> 1) <b>Le message du dirigeant</b> (2 pages) : compare-le à celui d'il y a 3 ans — les promesses ont-elles été tenues ? 2) <b>Les facteurs de risque</b> : la section la plus honnête du document (obligation légale) ; repère les 3 premiers. 3) <b>Les chiffres clés sur 5 ans</b> : ventes, marges, dette, cash — tes leçons 27 à 30 en application. 4) <b>La répartition du chiffre d'affaires</b> par activité et par zone : d'où vient VRAIMENT l'argent ? (Beaucoup de « géants de l'IA » gagnent en réalité leur vie ailleurs.) 5) <b>La rémunération des dirigeants</b> : indexée sur quoi ? Le cours à 3 ans ou le bonus annuel ? Ça dit tout de leurs incitations.</p><p><b>Le risque.</b> Le vernis marketing des premières pages — photos léchées, mots-clés à la mode (« IA », « durable », « transformation »). Règle d'analyste : plus une entreprise communique sur un mot à la mode, plus il faut vérifier dans les chiffres que la réalité suit.</p>",
exemple:"En 30 minutes dans le rapport de ModeGroupe : le PDG promettait en 2023 « le retour à 10 % de marge en 2025 » → la marge 2025 est à 6,1 % (promesse ratée, à retenir) ; risque n°1 listé : « dépendance à un fournisseur asiatique unique » (jamais mentionné dans les articles de presse !) ; 71 % des ventes viennent d'un seul pays. Trois découvertes qu'aucun influenceur ne t'aurait données.",
quiz:[
{q:"Quelle section du rapport annuel est la plus « honnête » ?",o:["La publicité des premières pages","Les facteurs de risque, une obligation légale","Le mot du président"],b:1,e:"L'entreprise est légalement tenue d'y lister ce qui pourrait mal tourner : une mine d'or que presque personne ne lit."},
{q:"Pourquoi comparer le message du dirigeant à celui d'il y a 3 ans ?",o:["Pour vérifier son style d'écriture","Pour vérifier si les promesses passées ont été tenues","Pour compter les pages"],b:1,e:"Un management qui tient ses promesses chiffrées est rare et précieux ; un serial-prometteur se repère en 10 minutes d'archives."},
{q:"Face à un rapport saturé de mots à la mode (« IA partout »), le réflexe d'analyste est…",o:["Acheter vite, c'est l'avenir","Vérifier dans les chiffres si la réalité suit le discours","Fuir systématiquement"],b:1,e:"Le mot à la mode n'est ni bon ni mauvais signe en soi : c'est l'écart entre le discours et les chiffres qui informe."}]},

{id:"l33",niveau:4,duree:8,badge:"🔄",badgeNom:"Météorologue des cycles",titre:"Secteurs et cycles : pourquoi tout ne monte pas en même temps",
contenu:"<p><b>Le quoi.</b> L'économie respire en cycles (expansion → surchauffe → ralentissement → reprise), et chaque secteur y réagit à sa manière. Les <b>cycliques</b> amplifient le mouvement : automobile, banques, construction, luxe, semi-conducteurs. Les <b>défensifs</b> l'amortissent : santé, alimentation, services aux collectivités — on se soigne et on mange même en récession.</p><p><b>Le pourquoi.</b> Comprendre cette mécanique éclaire les briefings : « les banques montent car les taux remontent », « le luxe souffre du ralentissement chinois »… Et elle explique un piège de valorisation redoutable : une cyclique paraît <b>la moins chère</b> (PER minuscule) exactement <b>en haut de cycle</b>, quand ses profits sont gonflés et sur le point de retomber. Le PER bas des cycliques au sommet est l'attrape-débutant classique.</p><p><b>Le comment.</b> 1) Classe chaque valeur de ta watchlist : cyclique ou défensive ? Ta réaction à ses variations changera du tout au tout. 2) Vérifie l'équilibre de ton portefeuille : 100 % cyclique = montagnes russes garanties. 3) Pour juger une cyclique, regarde ses profits <b>sur un cycle entier</b> (7-10 ans), jamais sur la meilleure année. 4) Rappel d'humilité : prévoir le PROCHAIN cycle est impossible — on se positionne pour traverser tous les temps, pas pour deviner la météo.</p><p><b>Le risque.</b> La rotation sectorielle érigée en stratégie (« je sors des cycliques avant la récession, j'y reviens avant la reprise ») : séduisante sur le papier, elle exige de prévoir deux retournements — les professionnels eux-mêmes s'y cassent les dents. Pour toi, c'est une grille de LECTURE, pas un mode d'emploi de trading.</p>",
exemple:"2021, sortie de Covid : AutoPièces affiche un PER de 6 — « une affaire ! ». Sauf que ses profits sont au sommet historique du cycle (rattrapage de la demande). 2023 : la demande se normalise, les profits chutent de 60 %, et le PER remonte à 15 sur cours divisé par deux. Le PER de 6 était une illusion d'optique de haut de cycle — la santé, elle, au PER de 18 constant, a mieux protégé.",
quiz:[
{q:"Un secteur défensif est un secteur…",o:["De l'armement uniquement","Dont l'activité résiste aux récessions (santé, alimentation…)","Qui monte plus vite que les autres"],b:1,e:"On mange, on se soigne, on s'éclaire par tous les temps : ces secteurs amortissent les cycles."},
{q:"Pourquoi une cyclique au PER très bas en haut de cycle est-elle un piège ?",o:["Ses profits gonflés vont retomber : l'action n'est pas si bon marché","Le PER bas est toujours un piège","Les cycliques ne font jamais de profits"],b:0,e:"PER = prix ÷ profits ; si les profits sont à un pic temporaire, le ratio flatte artificiellement. On juge une cyclique sur un cycle complet."},
{q:"Que penser de la « rotation sectorielle » pour un particulier ?",o:["C'est la stratégie idéale","C'est une grille de lecture utile, mais pas une stratégie de trading : elle exige de prévoir les retournements","C'est illégal"],b:1,e:"Comprendre les rotations aide à lire les marchés ; les trader exige des prévisions que personne ne réussit durablement."}]},

{id:"l34",niveau:4,duree:10,badge:"🎓",badgeNom:"Analyste diplômé",titre:"Ton étude de cas : analyser une entreprise de A à Z",
contenu:"<p><b>Le quoi.</b> La leçon de synthèse du niveau 4 : assembler les sept leçons précédentes en une <b>méthode d'analyse complète</b>, applicable en 2 à 3 heures à n'importe quelle entreprise, et qui débouche sur une thèse écrite digne de ce nom.</p><p><b>La méthode MENTOR en 6 étapes.</b> 1) <b>Comprendre le métier</b> (30 min) : que vend-elle, à qui, qu'est-ce qui ferait fuir les clients ? Si tu ne peux pas l'expliquer à un enfant de 10 ans, passe ton chemin — règle de Peter Lynch. 2) <b>La solidité</b> (20 min) : bilan, dette nette, trésorerie (leçon 27). 3) <b>La qualité</b> (30 min) : marges et ROE sur 10 ans, cash qui suit le bénéfice (leçons 28-30). 4) <b>Les risques</b> (20 min) : la section dédiée du rapport annuel + une question à te poser toi-même : « qu'est-ce qui doit rester vrai pour que ça marche ? » (leçon 32). 5) <b>Le prix</b> (20 min) : PER vs sa moyenne 10 ans, rendement du FCF, position dans le cycle (leçons 31, 33). 6) <b>La thèse écrite</b> (20 min) : le format 5 points de la leçon 22 — idée, confirmation, invalidation, horizon, risque accepté.</p><p><b>Le comment (ton examen pratique).</b> Choisis une entreprise de ta watchlist et déroule les 6 étapes en notant tout au Journal. Puis demande son avis à ton professeur IA via le chat : il pointera ce que tu as manqué. C'est ce travail — pas la lecture — qui fait de toi un analyste.</p><p><b>Le risque.</b> L'excès de confiance du jeune diplômé : une belle analyse reste une opinion sur un avenir incertain. Même les meilleures thèses du monde se trompent souvent — d'où les positions modestes, la diversification (jamais plus de 20 % sur une ligne !), et l'ETF diversifié qui reste le cœur du portefeuille. L'analyse d'entreprises est un satellite passionnant, pas le réacteur principal.</p>",
exemple:"Étude de cas condensée sur ChocoSuisse : métier compréhensible (chocolat premium, clients fidèles) ✓ ; dette/EBITDA 0,9 ✓ ; marge nette 14 % stable, ROE 17 %, cash = 95 % des bénéfices ✓ ; risques : prix du cacao (x2 depuis 2 ans !) et dépendance aux fêtes ; prix : PER 24 contre 19 de moyenne historique ✗ un peu cher. Thèse : « belle maison, prix exigeant — j'attends soit un repli de 15 %, soit deux trimestres confirmant que les hausses de prix passent ». C'est ça, une conclusion d'analyste : pas « achat » ou « fuite », mais des conditions.",
quiz:[
{q:"Quelle est la toute première étape d'une analyse d'entreprise ?",o:["Regarder le graphique du cours","Comprendre le métier au point de l'expliquer à un enfant","Calculer le PER"],b:1,e:"Si tu ne comprends pas comment l'entreprise gagne sa vie, aucun ratio ne te sauvera. C'est la règle n°1 de Peter Lynch."},
{q:"Une analyse complète débouche sur…",o:["Un ordre d'achat immédiat","Une thèse écrite avec conditions de confirmation et d'invalidation","Un objectif de cours au centime près"],b:1,e:"La conclusion d'un analyste est une thèse conditionnelle, pas une injonction — et souvent la conclusion est « pas à ce prix »."},
{q:"Quelle place pour les actions analysées en direct dans ton portefeuille ?",o:["100 % : l'analyse rend invincible","Un satellite limité, autour d'un cœur d'ETF diversifiés","0 % : l'analyse ne sert à rien"],b:1,e:"Même excellente, une thèse reste une opinion faillible. Le cœur diversifié assure ta trajectoire ; les convictions restent des satellites mesurés."}]}
);
