function rendreSimulationEnCours(){
  const e=simEtat().enCours;
  if(!e){ vueEcole="simulateur"; return rendreSimulateur(); }
  const sim=SIMULATIONS.find(s=>s.id===e.id);
  const v=sim.valeurs, mois=e.mois, cours=v[mois];
  if(mois>=v.length-1) return rendreFinSimulation();
  const valeur=e.parts*cours, total=valeur+e.cash;
  const varMois=mois>0?(cours/v[mois-1]-1)*100:0;
  const serie=v.slice(0,mois+1).map((c,i)=>({d:i,c:c}));
  const une=e.mystere?uneGenerique(sim,mois):(sim.unes[mois]||uneGenerique(sim,mois));
  const investi=SIM_CAPITAL+SIM_MENSUEL*mois;
  let h='<button class="btn discret" style="justify-content:flex-start" onclick="vueEcole=\'simulateur\';rendre()">‹ Mettre en pause</button>';
  h+='<div class="enTete"><div><h2>'+(e.mystere?"❓ Scénario mystère":sim.emoji+" "+ech(sim.titre))+'</h2><p class="sousTitre" style="text-transform:capitalize">'+nomMoisSim(sim,mois,e.mystere)+" · mois "+(mois+1)+"/"+v.length+"</p></div></div>";
  h+='<div class="progExt"><div class="progInt" style="width:'+((mois+1)/v.length*100)+'%"></div></div>';
  h+='<div class="carte centre"><div class="petit">Ton patrimoine simulé (versé : '+fmtEUR(investi,0)+')</div><div class="heroChiffre" style="font-size:34px">'+fmtEUR(total,0)+'</div><div class="'+clsVar(total-investi)+'">'+(total>=investi?"+":"")+fmtEUR(total-investi,0)+" ("+fmtPct(investi?(total/investi-1)*100:0)+')</div><div class="petit mHaut8">📦 Investi : '+fmtEUR(valeur,0)+' · 💶 Liquide : '+fmtEUR(e.cash,0)+' · Indice ce mois : <span class="'+clsVar(varMois)+'">'+fmtPct(varMois)+"</span></div>"+dessinerGraphique(serie)+"</div>";
  h+='<div class="carte" style="border-left:4px solid var(--ambre)"><div class="carteTitre"><span class="ico">🗞️</span>Les unes de l\'époque</div><p><i>'+ech(une)+"</i></p></div>";
  h+='<div class="carteTitre mHaut"><span class="ico">🎯</span>Ta décision du mois</div>';
  const btn=(action,label,sous,cls)=>'<button class="choix '+(cls||"")+'" onclick="decisionSimulation(\''+action+'\')">'+label+(sous?'<span class="sousChoix">'+sous+"</span>":"")+"</button>";
  h+=btn("dca","📅 Verser mes "+fmtEUR(SIM_MENSUEL,0)+" comme prévu","Le plan, rien que le plan");
  h+=btn("renforcer","💪 Verser le double si possible","Puiser dans le liquide pour profiter des prix — ou courir après la hausse ?");
  h+=btn("suspendre","⏸ Ne pas verser ce mois-ci","L'épargne reste en liquide");
  if(e.parts>0) h+=btn("vendreTout","🚨 TOUT vendre","Sortir du marché, tout en liquide");
  if(e.cash>SIM_MENSUEL*2) h+=btn("investirTout","🌊 Investir tout mon liquide ("+fmtEUR(e.cash,0)+")","Revenir (ou renforcer) massivement");
  return h;
}
function decisionSimulation(action){
  const e=simEtat().enCours; if(!e) return;
  const sim=SIMULATIONS.find(s=>s.id===e.id), cours=sim.valeurs[e.mois];
  // L'épargne du mois arrive, puis la décision s'applique au cours du mois courant.
  if(action==="dca"){ e.parts+=SIM_MENSUEL/cours; }
  else if(action==="renforcer"){ // le double = épargne du mois + autant pioché dans le liquide (si disponible)
    const extra=Math.min(SIM_MENSUEL,e.cash);
    e.parts+=(SIM_MENSUEL+extra)/cours; e.cash-=extra;
  }
  else if(action==="suspendre"){ e.cash+=SIM_MENSUEL; e.moisSansDCA++; }
  else if(action==="vendreTout"){ e.cash+=e.parts*cours+SIM_MENSUEL; e.parts=0; e.ventesTotales++; e.moisSansDCA++; }
  else if(action==="investirTout"){ e.cash+=SIM_MENSUEL; e.parts+=e.cash/cours; e.cash=0; e.rachats++; }
  e.decisions.push({mois:e.mois,action:action,cours:cours});
  e.mois++;
  sauver();
  if(e.mois>=sim.valeurs.length-1){ rendre(); window.scrollTo(0,0); }
  else{ rendre(); }
}
function rendreFinSimulation(){
  const e=simEtat().enCours;
  const sim=SIMULATIONS.find(s=>s.id===e.id), v=sim.valeurs, dernier=v[v.length-1];
  const n=v.length-1;
  const vous=e.parts*dernier+e.cash;
  // Référence 1 : DCA discipliné — la trajectoire EXACTE d'un joueur qui aurait
  // choisi « verser comme prévu » à chaque mois, sans jamais dévier.
  let partsDca=SIM_CAPITAL/v[0]; for(let m=0;m<n;m++) partsDca+=SIM_MENSUEL/v[m];
  const dca=partsDca*dernier;
  // Référence 2 : tout-liquide (jamais investi).
  const cash=SIM_CAPITAL+SIM_MENSUEL*n;
  const investi=SIM_CAPITAL+SIM_MENSUEL*n;
  // Analyse comportementale locale.
  const minV=Math.min(...v), notes=[];
  e.decisions.filter(d=>d.action==="vendreTout").forEach(d=>{
    if(d.cours<=minV*1.18) notes.push("🚨 Tu as tout vendu à "+fmtNb((d.cours/minV-1)*100,0)+" % du point le plus bas — la panique vend toujours au pire moment (leçon 17).");
    else notes.push("↩️ Tu es sorti du marché au mois "+(d.mois+1)+". Sortir se décide en une seconde ; savoir QUAND revenir est le vrai problème.");
  });
  e.decisions.filter(d=>d.action==="investirTout").forEach(d=>{
    const venteAvant=e.decisions.find(x=>x.action==="vendreTout"&&x.mois<d.mois);
    if(venteAvant&&d.cours>venteAvant.cours) notes.push("💸 Tu as racheté PLUS CHER ("+fmtNb(d.cours,0)+") que ton prix de vente ("+fmtNb(venteAvant.cours,0)+") : l'aller-retour t'a appauvri — c'est le coût classique du market timing.");
    if(venteAvant&&d.cours<venteAvant.cours) notes.push("🎩 Tu as racheté moins cher que ta vente — bien joué… mais sache que statistiquement, ce coup-là échoue bien plus souvent qu'il ne réussit.");
  });
  if(e.moisSansDCA>n*0.3) notes.push("⏸ Tu as suspendu ton épargne "+e.moisSansDCA+" mois sur "+n+" — souvent pendant les baisses, précisément quand tes versements achetaient le plus de parts (leçon 12).");
  if(e.ventesTotales===0&&e.moisSansDCA<=2) notes.push("🏛️ Discipline remarquable : tu as traversé la tempête sans jamais abandonner le plan. C'est LA compétence — tout le reste s'apprend dans les livres.");
  const battuDca=vous>=dca*0.995;
  // Archivage.
  simEtat().finies.push({id:e.id,mystere:e.mystere,date:new Date().toISOString(),vous:Math.round(vous),dca:Math.round(dca),cash:Math.round(cash)});
  const decisionsResume=e.decisions.filter(d=>d.action!=="dca").map(d=>"mois "+(d.mois+1)+" : "+d.action+" (indice "+fmtNb(d.cours,0)+")").join(" ; ")||"DCA parfait du début à la fin";
  journalAjouter({type:"etape",texte:"Simulation « "+(e.mystere?"mystère → "+sim.titre:sim.titre)+" » terminée : "+fmtEUR(vous,0)+" (DCA discipliné : "+fmtEUR(dca,0)+"). Écarts au plan : "+decisionsResume.slice(0,200)});
  simEtat().enCours=null; sauver();
  const ligne=(nom,val,star)=>'<div class="repLigne"><div class="repNom" style="width:150px">'+nom+'</div><div class="repBarre"><div class="repRemplie" style="width:'+Math.min(100,val/Math.max(vous,dca,cash)*100)+'%;background:'+(star?"var(--accent)":"#9CA3AF")+'"></div></div><div class="repPct" style="width:74px">'+fmtEUR(val,0)+"</div></div>";
  return '<div class="centre mHaut"><div style="font-size:52px">'+(e.mystere?"❓→"+sim.emoji:sim.emoji)+'</div><h1>Voyage terminé !</h1><p class="sousTitre">'+(e.mystere?"Le mystère était : ":"")+ech(sim.titre)+" ("+ech(sim.periode)+")</p></div>"+
  '<div class="carte"><div class="carteTitre"><span class="ico">🏁</span>Les comptes ('+fmtEUR(investi,0)+" versés)</div>"+
  ligne("🧑 Toi",vous,true)+ligne("🤖 DCA discipliné",dca)+ligne("🛏️ Jamais investi",cash)+
  '<div class="encart '+(battuDca?"succes":"info")+' mHaut8">'+(battuDca?"<b>Tu fais aussi bien ou mieux que la discipline pure.</b> Vérifie honnêtement (leçon 44) : compétence, ou chance de ce scénario ?":"<b>Le DCA discipliné t'a battu de "+fmtEUR(dca-vous,0)+".</b> C'est la leçon la plus chère et la plus utile du simulateur : la discipline mécanique bat presque toujours nos interventions.")+"</div></div>"+
  (notes.length?'<div class="carte"><div class="carteTitre"><span class="ico">🔬</span>Ce que tes décisions racontent</div>'+notes.map(x=>"<p class='mHaut8'>"+x+"</p>").join("")+"</div>":"")+
  '<div class="carte" style="border-left:4px solid var(--hausse)"><div class="carteTitre"><span class="ico">🎓</span>La leçon de cette époque</div><p>'+lierTermes(ech(sim.resume))+'</p><p class="petit mHaut8">Chaque traversée compte pour ton diplôme. Rejoue-la avec une autre stratégie : comparer ses propres parcours vaut tous les cours.</p></div>'+
  ((S.cles.gemini||S.cles.claude)?'<div id="zoneDebriefSim"><button class="btn secondaire" onclick="debriefSimulation(\''+sim.id+'\',\''+ech(decisionsResume).replace(/'/g,"\\'")+'\','+Math.round(vous)+","+Math.round(dca)+')">🎓 Débrief de mon professeur</button></div>':"")+

  S.journal.push({id:idUnique(),date:new Date().toISOString(),...entree});

function semainesJournal(){

  S.compteurs.joursJournal.forEach(j=>{ const d=new Date(j); const un=new Date(d.getFullYear(),0,1); set.add(d.getFullYear()+"-"+Math.floor(((d-un)/86400000+un.getDay())/7)); });
  return set.size;
}

function sheetDecisionVirtuelle(tickerPre){
  const options=[...S.positionsVirtuelles.map(p=>p.ticker),...S.watchlist.map(w=>w.ticker)].filter((v,i,a)=>a.indexOf(v)===i);

  '<label class="etiquette">Action</label><div class="segments" id="segAction"><button class="actif" data-v="acheter" onclick="segSel(this)">Acheter</button><button data-v="renforcer" onclick="segSel(this)">Renforcer</button><button data-v="vendre" onclick="segSel(this)">Vendre</button></div>'+
  '<label class="etiquette">Ticker</label><input class="champ" id="dvTicker" autocapitalize="characters" placeholder="ex. AAPL ou MC.PA" value="'+ech(tickerPre||options[0]||"")+'">'+
  '<div class="grille2"><div><label class="etiquette">Quantité</label><input class="champ" id="dvQte" type="text" inputmode="decimal" placeholder="ex. 2"></div><div><label class="etiquette">Cours actuel</label><input class="champ" id="dvPrix" type="text" inputmode="decimal" placeholder="auto si connu"></div></div>'+
  '<label class="etiquette">Ta thèse — pourquoi cette décision ? (le plus important)</label><textarea class="champ" id="dvThese" placeholder="ex. Je pense que… parce que… Ce qui me ferait changer d\'avis : …"></textarea>'+
  '<button class="btn mHaut" onclick="validerDecisionVirtuelle()">Valider et me faire débriefer 🎓</button>');
  const t=tickerPre||options[0]; const c=t?S.coursCache[t.toUpperCase()]:null;
  if(c&&c.prix){ const el=$("#dvPrix"); if(el) el.value=c.prix; }
}
function segSel(btn){ btn.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("actif")); btn.classList.add("actif"); }
async function validerDecisionVirtuelle(){
  const t=($("#dvTicker").value||"").trim().toUpperCase();
  const q=parseFloat(($("#dvQte").value||"").replace(",","."));
  let prix=parseFloat(($("#dvPrix").value||"").replace(",","."));
  const these=($("#dvThese").value||"").trim();
  const action=document.querySelector("#segAction .actif").dataset.v;
  if(!t||!q||q<=0){ toast("Ticker et quantité sont nécessaires"); return; }
  if(!prix){ const c=S.coursCache[t]; if(c&&c.prix)prix=c.prix; }
  if(!prix){ toast("Indique le cours actuel (je ne le connais pas encore pour "+t+")"); return; }
  const estEuro=/\.(PA|AS|BR|LS)$/i.test(t);
  const cout=enEUR(prix*q,estEuro?"EUR":"USD"); // liquidités fictives tenues en euros
  if(action!=="vendre"){
    if(cout>S.liquiditesVirtuelles+0.01){ toast("💸 Liquidités fictives insuffisantes ("+fmtEUR(S.liquiditesVirtuelles)+") — c'est déjà une leçon : on n'investit que ce qu'on a."); return; }
    S.liquiditesVirtuelles-=cout;
    const exist=S.positionsVirtuelles.find(p=>p.ticker===t);
    if(exist){ exist.pru=(exist.pru*exist.quantite+prix*q)/(exist.quantite+q); exist.quantite+=q; }
    else S.positionsVirtuelles.push({id:idUnique(),ticker:t,nom:t,quantite:q,pru:prix,devise:estEuro?"EUR":"USD",courtier:"virtuel",dateAchat:aujourdhuiISO(),marche:estEuro?"euronext":"us"});
  }else{
    const exist=S.positionsVirtuelles.find(p=>p.ticker===t);
    if(!exist||exist.quantite<q){ toast("Tu ne détiens pas "+q+" × "+t+" en virtuel."); return; }
    exist.quantite-=q; S.liquiditesVirtuelles+=cout;
    if(exist.quantite<=0.0001) S.positionsVirtuelles=S.positionsVirtuelles.filter(p=>p!==exist);
  }
  const decision={action,ticker:t,nom:t,quantite:q,prix,devise:estEuro?"EUR":"USD",these};
  journalAjouter({type:"decision_virtuelle",ticker:t,action,quantite:q,these,coursAlors:prix+" "+decision.devise});
  sauver();
  fermerSheet();
  // Débrief IA immédiat (appel dédié).
  ouvrirSheet(titreSheet("Débrief de ton professeur")+'<div class="chargeur"><div class="chargeurAnneau"></div><p class="chargeurEtape" id="etapeDebrief">Je relis ta décision…</p></div>');
  try{
    const d=await genererDebrief(decision,m=>{const el=$("#etapeDebrief");if(el)el.textContent=m;});
    S.compteurs.decisionsVirtuellesDebriefees++;
    journalAjouter({type:"debrief",ticker:t,texte:d.note_pedagogique,detail:d});
    sauver();
    ouvrirSheet(titreSheet("Débrief 🎓")+
      '<div class="encart succes"><b>Bien raisonné :</b><br>'+(d.bien_raisonne||[]).map(x=>"• "+lierTermes(ech(x))).join("<br>")+"</div>"+
      '<div class="encart alerte"><b>Points aveugles :</b><br>'+(d.points_aveugles||[]).map(x=>"• "+lierTermes(ech(x))).join("<br>")+"</div>"+
      '<div class="carte plate"><b>🤔 Pour aller plus loin :</b><p>'+lierTermes(ech(d.question_socratique||""))+"</p></div>"+
      "<p>"+lierTermes(ech(d.note_pedagogique||""))+"</p>"+
      (d.lecon_associee?'<p class="petit mHaut8">📚 À revoir à l\'École : '+lierTermes(ech(d.lecon_associee))+"</p>":"")+
      '<button class="btn mHaut" onclick="fermerSheet();rendre()">Merci prof ! ('+S.compteurs.decisionsVirtuellesDebriefees+"/5 débriefs)</button>");
  }catch(e){
    ouvrirSheet(titreSheet("Décision enregistrée ✓")+'<p>Ta décision est au journal, mais le débrief IA a échoué : '+ech(e.friendly?e.message:"réessaie plus tard.")+'</p><button class="btn mHaut" onclick="fermerSheet();rendre()">OK</button>');
  }
  rendre();
}

/* ---- Post-mortem hebdomadaire ---- */

  const relectures=S.postMortems.flatMap(pm=>pm.contenu.relectures||[]);
  if(relectures.length){
    const conf=relectures.filter(r=>r.verdict==="confirme").length,inf=relectures.filter(r=>r.verdict==="infirme").length,tot=relectures.filter(r=>r.verdict==="trop_tot").length;

  }
  if(_pmEnCours) h+='<div class="chargeur"><div class="chargeurAnneau"></div><p class="chargeurEtape" id="etapePM">Je relis mes conseils de la semaine…</p></div>';
  else h+='<div class="carte centre"><div style="font-size:40px">🔍</div><h3 class="mHaut8">Post-mortem hebdomadaire</h3><p class="petit mHaut8">'+(dim?"C'est dimanche — le jour idéal !":"Recommandé le dimanche, possible à tout moment.")+' Je relis mes propres conseils de la semaine face aux cours réels, et on en tire les leçons ensemble.</p>'+(dejaFait?'<p class="petit mHaut8">✓ Déjà fait il y a '+joursDepuis(dernierPM.date)+" jour(s).</p>":"")+'<button class="btn mHaut8" onclick="lancerPostMortem()">Lancer le post-mortem</button></div>';
  S.postMortems.slice().reverse().forEach((pm,ix)=>{
    const c=pm.contenu;

/* ============================================================
   SAUVEGARDE QUOTIDIENNE « iCloud » — le maximum automatisable
   dans une web app iOS : fichier daté + feuille de partage en 1 tap.
   ============================================================ */
function fichierSauvegarde(){
  const donnees={app:"MENTOR",version:S.version,exporteLe:new Date().toISOString(),donnees:S};
  return new File([JSON.stringify(donnees,null,1)],"mentor-sauvegarde-"+aujourdhuiISO()+".json",{type:"application/json"});
}
async function exporterSauvegarde(depuisRituel){
  const fichier=fichierSauvegarde();
  // navigator.share avec fichier : un tap sur « Enregistrer dans Fichiers » → iCloud Drive.
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[fichier]})){
    try{
      await navigator.share({files:[fichier],title:"Sauvegarde MENTOR"});
      S.sauvegarde.derniereDate=new Date().toISOString(); S.sauvegarde.rappelsIgnores=0; sauver();
      toast("☁️ Sauvegarde partagée — pense à « Enregistrer dans Fichiers » → iCloud Drive / MENTOR");
      rendre(); return;
    }catch(e){ // l'utilisateur a annulé la feuille de partage
      if(depuisRituel){ S.sauvegarde.rappelsIgnores++; sauver(); }
      return;
    }
  }
  // Repli : téléchargement classique.
  const url=URL.createObjectURL(fichier);
  const a=document.createElement("a"); a.href=url; a.download=fichier.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  S.sauvegarde.derniereDate=new Date().toISOString(); sauver(); rendre();
  toast("💾 Fichier de sauvegarde téléchargé");
}

/* ---- Restauration : intégrité, version, remplacer/fusionner, résumé ---- */
function restaurerFichier(fichier){

    catch(e){ ouvrirSheet(titreSheet("Fichier illisible")+'<p>Ce fichier n\'est pas une sauvegarde MENTOR valide (JSON illisible). Vérifie que tu as choisi un fichier <b>mentor-sauvegarde-…json</b>.</p><button class="btn mHaut" onclick="fermerSheet()">OK</button>'); return; }
    const d=paquet&&paquet.app==="MENTOR"?paquet.donnees:paquet;
    // Vérification d'intégrité minimale.
    if(!d||typeof d!=="object"||!d.cles||!d.profil){ ouvrirSheet(titreSheet("Sauvegarde invalide")+'<p>Le fichier ne contient pas les données attendues (profil, clés…). Est-ce bien une sauvegarde MENTOR ?</p><button class="btn mHaut" onclick="fermerSheet()">OK</button>'); return; }
    if((d.version||1)>1){ ouvrirSheet(titreSheet("Version plus récente")+'<p>Cette sauvegarde vient d\'une version plus récente de MENTOR ('+ech(String(d.version))+'). Mets l\'application à jour avant de restaurer.</p><button class="btn mHaut" onclick="fermerSheet()">OK</button>'); return; }
    window._resto=d;

      '<button class="btn mHaut" onclick="appliquerRestauration(\'remplacer\')">Tout remplacer par cette sauvegarde</button>'+
      '<button class="btn secondaire mHaut8" onclick="appliquerRestauration(\'fusionner\')">Fusionner (garde le plus complet des deux)</button>'+
      '<button class="btn discret mHaut8" onclick="fermerSheet()">Annuler</button>');
  };

function appliquerRestauration(mode){
  const d=window._resto; if(!d) return;
  const avant={j:S.journal.length,p:S.positionsReelles.length};
  if(mode==="remplacer"){ S=fusionDefaut(etatDefaut(),d); }
  else{
    // Fusion prudente : on additionne les historiques (sans doublons d'id),
    // on garde le profil/clés les plus récents non vides.
    const fusionListe=(a,b)=>{ const ids=new Set(a.map(x=>x.id)); return a.concat(b.filter(x=>!ids.has(x.id))); };
    const R=fusionDefaut(etatDefaut(),d);
    S.journal=fusionListe(S.journal,R.journal).sort((x,y)=>new Date(x.date)-new Date(y.date));
    S.briefings=fusionListe(S.briefings.map(b=>({id:b.date,...b})),R.briefings.map(b=>({id:b.date,...b})));
    S.postMortems=fusionListe(S.postMortems.map(p=>({id:p.date,...p})),R.postMortems.map(p=>({id:p.date,...p})));
    S.positionsReelles=fusionListe(S.positionsReelles,R.positionsReelles);
    S.positionsVirtuelles=fusionListe(S.positionsVirtuelles,R.positionsVirtuelles);
    S.ecole.leconsValidees=[...new Set([...S.ecole.leconsValidees,...R.ecole.leconsValidees])];
    S.compteurs.joursJournal=[...new Set([...S.compteurs.joursJournal,...R.compteurs.joursJournal])];
    if(!S.cles.gemini)S.cles.gemini=R.cles.gemini;
    if(!S.cles.twelveData)S.cles.twelveData=R.cles.twelveData;
    if(!S.profil.fait&&R.profil.fait)S.profil=R.profil;
    if(!S.planDepart)S.planDepart=R.planDepart;
  }
  delete window._resto;
  localStorage.setItem("mentor_v1",JSON.stringify(S));
  ouvrirSheet(titreSheet("Restauration réussie ✓")+
    '<p>Tout est revenu :</p><div class="carte plate"><p>📔 Journal : '+avant.j+" → "+S.journal.length+" entrées</p><p>💼 Positions réelles : "+avant.p+" → "+S.positionsReelles.length+"</p><p>🎓 Leçons validées : "+S.ecole.leconsValidees.length+"</p><p>👤 Profil : "+(S.profil.fait?"restauré":"—")+"</p></div>"+
    '<button class="btn mHaut" onclick="fermerSheet();rendre()">Reprendre où j\'en étais</button>');
  rendre();
}
/* ============================================================
   LECTEUR VOCAL — « Léo » 🧑‍🏫
   Pour ceux qui n'ont pas le courage de lire : chaque bloc de
   texte reçoit un petit bouton-personnage ; un tap, et Léo lit
   le texte à voix haute (synthèse vocale du téléphone, 100 %
   locale et gratuite — aucun appel réseau).
   Voix : masculine française douce en priorité (« Thomas » sur
   iOS), réglable dans Profil → Réglages. Les phrases sont
   découpées en petits morceaux : contournement du bug iOS qui
   coupe les longues lectures.
   ============================================================ */
const AVATAR_LEO='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="26" fill="#F2D5B8"/><path d="M10 30 Q12 12 32 10 Q52 12 54 30 L54 26 Q54 8 32 6 Q10 8 10 26 Z" fill="#6B7280"/><rect x="6" y="26" width="52" height="5" rx="2.5" fill="#1E5A8A"/><rect x="22" y="4" width="20" height="8" rx="2" fill="#1E5A8A"/><circle cx="22" cy="34" r="6.5" fill="none" stroke="#1F2937" stroke-width="2"/><circle cx="42" cy="34" r="6.5" fill="none" stroke="#1F2937" stroke-width="2"/><line x1="28.5" y1="34" x2="35.5" y2="34" stroke="#1F2937" stroke-width="2"/><circle cx="22" cy="34" r="2" fill="#1F2937"/><circle cx="42" cy="34" r="2" fill="#1F2937"/><path d="M24 46 Q32 50 40 46" fill="none" stroke="#8A5A3B" stroke-width="2.5" stroke-linecap="round" class="boucheLeo"/><path d="M26 44 Q32 47 38 44 L38 45 Q32 49 26 45 Z" fill="#8A5A3B" opacity=".5"/></svg>';

let _lecChunks=[],_lecIndex=0,_lecActif=false,_lecPause=false,_lecBloc=null,_lecTitre="",_lecViaIA=false;

function lecteurDispo(){ return ("speechSynthesis" in window)&&S.reglages.lecteurActif!==false; }

/* Choix de la voix : préférence stockée, sinon voix masculine française
   (Thomas = la voix homme française historique d'iOS), sinon toute voix fr. */
function voixFrancaises(){
  try{ return window.speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().startsWith("fr")); }
  catch(e){ return []; }
}
function scoreVoix(v){
  // Les voix « améliorées / premium » téléchargées sur iOS passent en priorité :
  // elles sont infiniment plus naturelles que les voix compactes par défaut.
  const n=v.name.toLowerCase(), u=(v.voiceURI||"").toLowerCase();
  let s=0;
  if(/premium/.test(n+u)) s+=40; if(/amélior|enhanced|qualité|quality/.test(n+u)) s+=30;
  const prefs=["thomas","nicolas","daniel","paul","henri","google français"];
  const ix=prefs.findIndex(p=>n.includes(p)); if(ix>=0) s+=20-ix;
  if(/compact/.test(u)) s-=15;
  return s;
}
function voixDeLeo(){
  const voix=voixFrancaises();
  if(!voix.length) return null;
  // 1. Choix mémorisé par identifiant unique (voiceURI) — fiable.
  if(S.reglages.voixLeoURI){ const v=voix.find(x=>x.voiceURI===S.reglages.voixLeoURI); if(v) return v; }
  // 2. Ancien choix par nom : PIÈGE iOS — la voix compacte et la voix
  //    « qualité » portent le MÊME nom (ex. deux « Audrey »). On prend
  //    la meilleure des homonymes, jamais la première venue.
  if(S.reglages.voixLeo){
    const memesNom=voix.filter(x=>x.name===S.reglages.voixLeo);
    if(memesNom.length) return memesNom.sort((a,b)=>scoreVoix(b)-scoreVoix(a))[0];
  }
  return voix.slice().sort((a,b)=>scoreVoix(b)-scoreVoix(a))[0];
}
// iOS charge les voix en différé : on écoute l'événement pour être prêt.
if("speechSynthesis" in window){ try{ window.speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }

/* Nettoyage du texte pour l'oreille : émojis et symboles muets retirés,
   abréviations financières développées. */
function texteVersParole(t){
  return String(t||"")
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}\u{1F1E6}-\u{1F1FF}]/gu," ")
    .replace(/‹|›|«|»/g," ").replace(/·|•|→|⬇︎|✓|✗|✕|✨|—/g,", ")
    .replace(/\bPRU\b/g,"P.R.U").replace(/\bETF\b/g,"E.T.F").replace(/\bPEA\b/g,"P.E.A")
    .replace(/\bCTO\b/g,"C.T.O").replace(/\bDCA\b/g,"D.C.A").replace(/\bCFD\b/g,"C.F.D")
    .replace(/\bPFU\b/g,"P.F.U").replace(/\bAMF\b/g,"A.M.F").replace(/\bPER\b/g,"P.E.R")
    .replace(/%/g," pour cent").replace(/\s€/g," euros").replace(/€/g," euros")
    .replace(/\s+/g," ").trim();
}
function decouperEnPhrases(t){
  const morceaux=t.match(/[^.!?;:]+[.!?;:]*/g)||[t];
  const chunks=[]; let cour="";
  for(const m of morceaux){
    if((cour+m).length>190&&cour){ chunks.push(cour.trim()); cour=m; }
    else cour+=m;
  }
  if(cour.trim()) chunks.push(cour.trim());
  return chunks.filter(c=>c.length>1);
}

function lireBloc(bloc,ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  if(!("speechSynthesis" in window)){ toast("La lecture vocale n'est pas disponible sur cet appareil."); return; }
  if(_lecActif&&_lecBloc===bloc){ basculerPauseLecture(); return; } // re-tap sur le même bloc = pause/reprise
  arreterLecture();
  const clone=bloc.cloneNode(true);
  clone.querySelectorAll("button,input,textarea,select,svg,.btnLire").forEach(n=>n.remove());
  const texte=texteVersParole(clone.innerText||clone.textContent||"");
  if(texte.length<3){ toast("Rien à lire ici."); return; }
  const titreEl=bloc.querySelector(".carteTitre,.dTitre,b,h1,h2,h3");
  _lecTitre=titreEl?texteVersParole(titreEl.textContent).slice(0,42):"ce passage";
  // Voix IA (Gemini TTS) si activée et quota du jour intact ; sinon voix locale.
  if(typeof voixIAActive==="function"&&voixIAActive()&&!ttsEpuiseAujourdhui()&&navigator.onLine){
    lireBlocIA(bloc,texte);
    return;
  }
  _lecChunks=decouperEnPhrases(texte); _lecIndex=0; _lecActif=true; _lecPause=false; _lecBloc=bloc; _lecViaIA=false;
  bloc.classList.add("enLecture");
  majBarreLecteur();
  parlerChunkSuivant();
}
function parlerChunkSuivant(){
  if(!_lecActif||_lecPause||_lecIndex>=_lecChunks.length){ if(_lecActif&&_lecIndex>=_lecChunks.length) arreterLecture(); return; }
  const u=new SpeechSynthesisUtterance(_lecChunks[_lecIndex]);
  try{ const v=voixDeLeo(); if(v) u.voice=v; }catch(e){} // certains navigateurs refusent l'affectation : la langue suffit alors
  u.lang="fr-FR";
  u.rate=S.reglages.vitesseLeo||0.95;  // légèrement ralenti : voix posée de professeur
  // pitch neutre : sur iOS, modifier la hauteur peut dégrader certaines voix
  // « qualité » vers un rendu synthétique — on n'y touche plus.
  u.pitch=1;
  u.onend=()=>{ if(!_lecActif) return; _lecIndex++; parlerChunkSuivant(); };
  u.onerror=()=>{ if(_lecActif) arreterLecture(); };
  try{ window.speechSynthesis.speak(u); }catch(e){ arreterLecture(); }
}
/* iOS gère mal pause/resume natifs → pause maison : on coupe et on retiendra
   le morceau en cours pour reprendre au même endroit. */
function basculerPauseLecture(){
  if(!_lecActif) return;
  if(_lecViaIA){ // la voix IA permet une vraie pause/reprise au sample près
    if(_lecPause){ _lecPause=false; if(_audioLeo) _audioLeo.play().catch(()=>{}); }
    else{ _lecPause=true; if(_audioLeo) _audioLeo.pause(); }
  }else if(_lecPause){ _lecPause=false; parlerChunkSuivant(); }
  else{ _lecPause=true; try{ window.speechSynthesis.cancel(); }catch(e){} }
  majBarreLecteur();
}
function arreterLecture(){
  _lecActif=false; _lecPause=false; _lecChunks=[]; _lecIndex=0; _lecViaIA=false;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  if(typeof _audioLeo!=="undefined"&&_audioLeo){ try{ _audioLeo.pause(); }catch(e){} _audioLeo=null; }
  if(_lecBloc){ _lecBloc.classList.remove("enLecture"); _lecBloc=null; }
  majBarreLecteur();
}
function majBarreLecteur(){
  let barre=document.getElementById("lecteurBarre");
  if(!_lecActif){ if(barre) barre.remove(); return; }
  if(!barre){ barre=document.createElement("div"); barre.id="lecteurBarre"; document.body.appendChild(barre); }
  barre.innerHTML='<span class="avatarLeo'+(_lecPause?"":" parle")+'">'+AVATAR_LEO+'</span>'+
    '<div class="lecteurTexte"><b>Léo '+(_lecPause?"est en pause":"te lit")+'</b><span>'+ech(_lecTitre)+"…</span></div>"+
    '<button class="lecteurBtn" onclick="basculerPauseLecture()" aria-label="Pause / reprise">'+(_lecPause?"▶":"⏸")+"</button>"+
    '<button class="lecteurBtn" onclick="arreterLecture()" aria-label="Arrêter la lecture">✕</button>';
}

/* ---- Injection automatique des boutons d'écoute ----
   Un MutationObserver surveille l'app et la sheet : chaque bloc de texte
   (cartes, encarts, bulles du chat, chaînes causales) reçoit son
   bouton-Léo, quel que soit l'écran — présent et futur. */
function injecterLecteurs(){
  if(!lecteurDispo()) return;
  const cibles=document.querySelectorAll("#app .carte, #app .encart, #app .bulle.ia, #sheet .carte, #sheet .encart");
  cibles.forEach(bloc=>{
    if(bloc.querySelector(":scope > .btnLire")) return;
    if(bloc.querySelector(".chargeurAnneau")) return;               // pas pendant un chargement
    if((bloc.innerText||"").trim().length<60) return;                // trop court pour mériter une lecture
    const b=document.createElement("button");
    b.className="btnLire"; b.setAttribute("aria-label","Écouter ce texte avec Léo"); b.title="Écouter avec Léo";
    b.innerHTML=AVATAR_LEO;
    b.onclick=(ev)=>lireBloc(bloc,ev);
    bloc.classList.add("aLecteur");
    bloc.insertBefore(b,bloc.firstChild);
  });
  // La sheet entière (définitions du glossaire, tutoriels…) : un bouton dans son titre.
  const sheet=document.getElementById("sheet");
  const titreSh=sheet&&sheet.querySelector(".sheetTitre");
  if(titreSh&&!titreSh.querySelector(".btnLire")&&(sheet.innerText||"").length>80){
    const b=document.createElement("button");
    b.className="btnLire enTitre"; b.setAttribute("aria-label","Écouter avec Léo"); b.title="Écouter avec Léo";
    b.innerHTML=AVATAR_LEO;
    b.onclick=(ev)=>lireBloc(sheet,ev);
    titreSh.insertBefore(b,titreSh.lastElementChild);
  }
  // Si le bloc en cours de lecture a disparu (navigation), on arrête proprement.
  if(_lecBloc&&!document.body.contains(_lecBloc)) arreterLecture();
}

/* ============================================================
   LÉO — VOIX IA (qualité naturelle, via la clé Gemini)
   La synthèse locale d'iOS peut sonner robotique (surtout la
   voix « compacte » par défaut). Ici : les modèles TTS de
   Gemini, voix neuronales naturelles, pilotées par consigne
   (« voix d'homme douce, calme, posée de professeur »).
   Réalités du niveau gratuit : quota TTS restreint (quelques
   lectures par jour) → gros morceaux (~1 300 caractères),
   cache de session, et REPLI AUTOMATIQUE sur la voix locale
   dès que le quota est atteint. L'audio arrive en PCM 16 bits
   24 kHz : on l'emballe en WAV pour le lire nativement.
   ============================================================ */
const VOIX_IA=[
 {id:"Algieba",nom:"Grave et soyeuse (recommandée)"},
 {id:"Charon",nom:"Posée, informative"},
 {id:"Enceladus",nom:"Feutrée, tout en souffle"},
 {id:"Iapetus",nom:"Claire et nette"},
 {id:"Sulafat",nom:"Chaleureuse"}
];
const CONSIGNE_TTS="Lis ce texte en français, d'une voix d'homme douce, calme et posée — le ton d'un professeur bienveillant qui prend son temps. Marque de courtes pauses entre les idées :\n\n";
let _audioLeo=null,_cacheAudio={};

function voixIAActive(){ return S.reglages.voixLeoMode==="ia"&&(S.cles.gemini||"").length>0; }
function ttsEpuiseAujourdhui(){ return S.reglages.ttsKoJour===aujourdhuiISO(); }

/* PCM 16 bits mono 24 kHz (base64) → blob WAV lisible par <audio>. */
function pcmVersWav(b64,tauxEch){
  tauxEch=tauxEch||24000;
  const bin=atob(b64), n=bin.length;
  const buf=new ArrayBuffer(44+n), dv=new DataView(buf);
  const ecrire=(pos,txt)=>{ for(let i=0;i<txt.length;i++) dv.setUint8(pos+i,txt.charCodeAt(i)); };
  ecrire(0,"RIFF"); dv.setUint32(4,36+n,true); ecrire(8,"WAVE"); ecrire(12,"fmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,tauxEch,true); dv.setUint32(28,tauxEch*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  ecrire(36,"data"); dv.setUint32(40,n,true);
  for(let i=0;i<n;i++) dv.setUint8(44+i,bin.charCodeAt(i));
  return new Blob([buf],{type:"audio/wav"});
}
/* Cherche récursivement une longue chaîne base64 audio dans une réponse JSON
   (robustesse : les formats varient selon les générations de modèles TTS). */
function trouverAudioBase64(obj,prof){
  if(prof>8||obj==null) return null;
  if(typeof obj==="string") return (obj.length>2000&&/^[A-Za-z0-9+/=\s]+$/.test(obj.slice(0,200)))?obj.replace(/\s/g,""):null;
  if(typeof obj!=="object") return null;
  for(const k of Object.keys(obj)){ const r=trouverAudioBase64(obj[k],(prof||0)+1); if(r) return r; }
  return null;
}
/* Appel TTS : d'abord la voie « generateContent » (format historique bien
   connu), puis la voie « interactions » (générations récentes) si 404.
   La voie qui répond est mémorisée. */
async function ttsGemini(texte){
  const cle=S.cles.gemini, voix=S.reglages.voixIA||"Algieba";
  const voies=S.reglages.ttsVoie==="interactions"?["interactions","legacy"]:["legacy","interactions"];
  let derniere=null;
  for(const voie of voies){
    try{
      let rep;
      if(voie==="legacy"){
        rep=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+(S.reglages.modeleTTS||"gemini-2.5-flash-preview-tts")+":generateContent?key="+encodeURIComponent(cle),{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({contents:[{parts:[{text:CONSIGNE_TTS+texte}]}],
            generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:voix}}}}})});
      }else{
        rep=await fetch("https://generativelanguage.googleapis.com/v1beta/interactions?key="+encodeURIComponent(cle),{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({model:"gemini-3.1-flash-tts-preview",input:CONSIGNE_TTS+texte,
            response_format:{type:"audio"},generation_config:{speech_config:[{voice:voix}]}})});
      }
      if(rep.status===429){ const e=new Error("quota"); e.statut=429; throw e; }
      if(!rep.ok){ const e=new Error("http "+rep.status); e.statut=rep.status; throw e; }
      const data=await rep.json();
      const b64=trouverAudioBase64(data,0);
      if(!b64) throw new Error("pas d'audio dans la réponse");
      if(S.reglages.ttsVoie!==voie){ S.reglages.ttsVoie=voie; sauver(); }
      return URL.createObjectURL(pcmVersWav(b64));
    }catch(e){
      derniere=e;
      if(e.statut===429) throw e;          // quota : inutile d'essayer l'autre voie
      // 404 / format inattendu → on tente l'autre génération de l'API
    }
  }
  throw derniere||new Error("TTS indisponible");
}
/* Découpage en gros morceaux (économie de quota). */
function decouperGros(t,taille){
  taille=taille||1300;
  const phrases=t.match(/[^.!?]+[.!?]*/g)||[t];
  const out=[]; let cour="";
  for(const p of phrases){ if((cour+p).length>taille&&cour){ out.push(cour.trim()); cour=p; } else cour+=p; }
  if(cour.trim()) out.push(cour.trim());
  return out;
}
/* Lecture IA d'un bloc : morceaux joués en chaîne, préchargement du suivant
   pendant la lecture du courant. Toute erreur → repli local transparent. */
async function lireBlocIA(bloc,texte){
  _lecChunks=decouperGros(texte); _lecIndex=0; _lecActif=true; _lecPause=false; _lecBloc=bloc; _lecViaIA=true;
  bloc.classList.add("enLecture"); majBarreLecteur();
  const cacheCle=(i)=>_lecChunks[i].length+"|"+_lecChunks[i].slice(0,60);
  const obtenir=async(i)=>{ const k=cacheCle(i); if(!_cacheAudio[k]) _cacheAudio[k]=ttsGemini(_lecChunks[i]); return _cacheAudio[k]; };
  try{
    let url=await obtenir(0);
    const suivant=(i)=>{ if(i+1<_lecChunks.length) obtenir(i+1).catch(()=>{}); }; // préchargement
    const jouer=(i,u)=>new Promise((res,rej)=>{
      if(!_lecActif){ res(); return; }
      _audioLeo=new Audio(u); _audioLeo.onended=()=>res(); _audioLeo.onerror=()=>rej(new Error("lecture audio"));
      _audioLeo.play().then(()=>suivant(i)).catch(rej);
    });
    for(let i=0;i<_lecChunks.length&&_lecActif;i++){
      _lecIndex=i; majBarreLecteur();
      if(i>0) url=await obtenir(i);
      await jouer(i,url);
      while(_lecPause&&_lecActif) await new Promise(r=>setTimeout(r,250));
    }
    if(_lecActif) arreterLecture();
  }catch(e){
    // Repli : voix locale pour la suite, sans casser l'expérience.
    if(e&&e.statut===429){ S.reglages.ttsKoJour=aujourdhuiISO(); sauver(); toast("🔊 Quota gratuit de la voix IA atteint pour aujourd'hui — je continue avec la voix du téléphone.",3600); }
    else toast("🔊 Voix IA indisponible — je continue avec la voix du téléphone.",3000);
    const resteTexte=_lecChunks.slice(_lecIndex).join(" ");
    _lecViaIA=false;
    if(_lecActif&&resteTexte){ _lecChunks=decouperEnPhrases(resteTexte); _lecIndex=0; parlerChunkSuivant(); }
    else arreterLecture();
  }
}
